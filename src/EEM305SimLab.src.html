<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- SECURITY: Content Security Policy. The page cannot load or send anything over the network (connect-src 'none'), cannot load external scripts, styles, fonts or images, and cannot submit forms. All code is inline in this file. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; font-src data:; img-src data: blob:; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>EEM305SimLab</title>
<style>
  /* ---------- Tema renkleri ---------- */
  :root{
    --bg:#f4f6fa;--card:#ffffff;--soft:#f3f5f9;--text:#0f172a;--muted:#64748b;--border:#e3e8ef;
    --accent:#2563eb;--accentBg:#e0eaff;--onAccent:#ffffff;
    --pc:#7c3aed;--pcBg:#efe9ff;
    --chg:#c2410c;--chgBg:#ffedd5;--ok:#15803d;--okBg:#dcfce7;--dim:#a0aec0;
    --nav:#0f172a;--navText:#f1f5f9;--navMuted:#94a3b8;
  }
  [data-theme="dark"]{
    --bg:#0b1120;--card:#111827;--soft:#172033;--text:#e5e7eb;--muted:#94a3b8;--border:#233046;
    --accent:#60a5fa;--accentBg:#1b3358;--onAccent:#0b1120;
    --pc:#c4b5fd;--pcBg:#2b1d55;
    --chg:#fdba74;--chgBg:#43200a;--ok:#4ade80;--okBg:#06301a;--dim:#4b5563;
    --nav:#060a14;--navText:#e5e7eb;--navMuted:#94a3b8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  :root{--uiFont:"Inter Var",Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;--monoFont:"JetBrains Mono Var","JetBrains Mono",Consolas,ui-monospace,monospace}
  body{font-family:var(--uiFont);font-feature-settings:"cv11","ss01";background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  .mono{font-family:var(--monoFont)}
  button{font:inherit}

  /* ---------- Üst menü ---------- */
  nav{position:sticky;top:0;z-index:20;height:52px;background:var(--nav);color:var(--navText);display:flex;align-items:center;gap:28px;padding:0 28px}
  .brand{font-weight:700;display:flex;align-items:center;gap:10px;cursor:pointer;font-size:15px}
  .chip{background:var(--accent);color:#fff;font-size:12px;font-weight:700;border-radius:6px;padding:3px 8px;letter-spacing:.3px}
  nav .links{display:flex;gap:4px}
  nav .links a{color:var(--navMuted);padding:7px 14px;border-radius:8px;font-size:14px;text-decoration:none}
  nav .links a.active,nav .links a:hover{color:var(--navText);background:rgba(255,255,255,.09)}
  body.simMode nav,body.simMode footer{display:none}

  .wrap{max-width:1280px;margin:0 auto;padding:32px 28px}
  h1{font-size:28px;margin:0 0 8px;letter-spacing:-.3px;font-weight:700}
  h2{font-size:18px;margin:0 0 14px;font-weight:650}
  .lead{color:var(--muted);max-width:none;font-size:16px;margin:0}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px 28px}
  .btn{font-size:14px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:8px;padding:6px 14px;cursor:pointer;white-space:nowrap}
  .btn:hover{background:var(--soft)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
  .btn:disabled{opacity:.4;cursor:default}
  .tags{display:flex;gap:6px;flex-wrap:wrap}
  .tag{font-size:12px;border-radius:6px;padding:2px 9px;background:var(--soft);color:var(--muted);border:1px solid var(--border)}
  footer{color:var(--muted);font-size:13px;text-align:center;padding:8px 24px 28px}

  /* ---------- Ana sayfa ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:16px}
  .simCard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s,transform .15s}
  .simCard.ready{cursor:pointer}
  .simCard.ready:hover{border-color:var(--accent);transform:translateY(-2px)}
  .simCard.soon{opacity:.55}
  .simCard .title{font-weight:650;font-size:16px}
  .simCard .desc{color:var(--muted);font-size:14px;flex:1}
  .status{font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px;align-self:flex-start}
  .status.ready{background:var(--okBg);color:var(--ok)}
  .status.soon{background:var(--soft);color:var(--muted)}
  .secTitle{font-size:14px;font-weight:650;color:var(--muted);margin:32px 0 0}

  /* ---------- Ayarlar ---------- */
  .setRow{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:center;padding:16px 0;border-bottom:1px solid var(--border)}

  .setRow .setLbl{font-weight:600}
  .setRow .hint{font-size:13px;color:var(--muted);font-weight:400}
  .seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .seg button{background:var(--card);color:var(--muted);border:0;border-right:1px solid var(--border);padding:7px 16px;cursor:pointer;font-size:14px}
  .seg button:last-child{border-right:0}
  .seg button.on{background:var(--accent);color:var(--onAccent)}
  .saveBar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:20px;padding-top:20px;border-top:1px solid var(--border)}
  .saveMsg{font-size:13px;color:var(--ok)}
  .infoBox{background:var(--soft);border-radius:10px;padding:12px 14px;font-size:13px;color:var(--muted);margin-top:16px}

  /* ---------- Simülasyon ekranı: tek ekran, kaydırmasız ---------- */
  .simPage{height:100vh;display:flex;flex-direction:column;gap:10px;padding:12px 16px}
  .simHead{display:flex;flex-direction:column;gap:8px;flex:none}
  .toolbar{display:flex;gap:8px;align-items:center}
  .toolbar .title{font-weight:650;font-size:16px;margin:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .toolbar .spacer{flex:1}
  .counter{color:var(--muted);font-size:13px;min-width:92px;text-align:right}
  .iconBtn{border:1px solid var(--border);background:var(--card);color:var(--muted);border-radius:8px;width:34px;height:32px;cursor:pointer;font-size:16px}
  .iconBtn:hover{color:var(--text);background:var(--soft)}
  .progress{height:3px;background:var(--border);border-radius:3px;overflow:hidden}
  .progress div{height:100%;background:var(--accent);transition:width .2s}
  .headRow{display:flex;gap:14px;align-items:center}
  .headRow .stepInfo{flex:1 1 0;min-width:0}
  .headRow .stepInfo > div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .headRow .pills{flex-wrap:nowrap;overflow:hidden}
  .headRow .ctrl{flex:none}
  .headRow .regs{flex:1 1 0;min-width:0;justify-content:flex-end}
  .headRow .reg{flex:0 1 112px;min-width:66px;overflow:hidden}
  .headRow .reg .name{overflow:hidden;text-overflow:ellipsis}
  @media (max-width:1500px){.btn.big{min-width:0;padding:7px 14px}.reg .val{font-size:14px}.reg{padding:3px 7px}.reg .old{display:none}}
  .ctrl{display:flex;flex-direction:column;align-items:center;gap:3px}
  .ctrlBtns{display:flex;gap:8px}
  .btn.big{font-size:15px;padding:8px 22px;border-radius:10px;font-weight:600;min-width:104px}
  .ctrl .counter{min-width:0;text-align:center;font-size:12px}
  .keys{font-size:12px;color:var(--muted);margin-right:6px}
  .resH{font-size:13px;font-weight:650;color:var(--muted);margin:14px 0 6px}
  .resP{margin:0;font-size:14.5px}
  .resL{margin:0;padding-left:20px;font-size:14.5px}
  .resL li{margin-bottom:4px}
  .byte .mean{font-size:12px;margin-top:3px;line-height:1.35}
  .noteExtra{margin-top:8px;font-size:12px;color:var(--muted);font-family:var(--monoFont)}
  .stepInfo{min-width:0}
  .stepTitle{font-size:16px;font-weight:650}
  .stepSub{color:var(--muted);font-size:13px;margin-left:10px}
  .pills{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap}
  .pill{border-radius:6px;padding:2px 9px;font-size:12px;white-space:nowrap}
  .pill.exec{background:var(--accentBg);color:var(--accent)}
  .pill.pcp{background:var(--pcBg);color:var(--pc)}
  .regs{display:flex;gap:6px;flex:none}
  .reg{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:3px 10px;min-width:92px}
  .reg.changed{border-color:var(--chg)}
  .reg .name{font-size:10.5px;color:var(--muted);white-space:nowrap}
  .reg .val{font-size:16px;font-weight:600;white-space:nowrap}
  .old{color:var(--dim);font-size:.72em;text-decoration:line-through;margin-right:5px;font-weight:400}
  .chg{background:var(--chgBg);color:var(--chg);border-radius:4px;padding:0 4px}

  .cols{flex:1;min-height:0;display:grid;gap:10px;grid-template-columns:minmax(0,1fr) minmax(0,.8fr) minmax(0,1.25fr);grid-template-rows:minmax(0,1fr) var(--explH)}
  .panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .panel.full{grid-column:1/-1}
  :root{--explH:clamp(150px,21vh,200px)}
  .panel.full{height:var(--explH)}
  .panel.full .explGrid{height:100%;align-items:stretch}
  .panel.full .explGrid > div{min-height:0;overflow:hidden;display:flex;flex-direction:column}
  #opv,#ops,#note{min-height:0;overflow:auto}
  .tlBox{flex:1;min-height:0;height:auto !important}
  .pTitle{font-size:13px;font-weight:650;margin:0 0 6px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .pTitle small{font-weight:400;color:var(--muted);font-size:11.5px}
  .tblWrap{flex:1;min-height:0;overflow:hidden}
  table{width:100%;height:100%;border-collapse:collapse;font-size:clamp(10.5px,1.45vh,13px)}
  td,th{padding:1px 8px;line-height:1.25;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle;white-space:nowrap}
  th{font-size:10.5px;color:var(--muted);font-weight:600}
  tr.exec td{background:var(--accentBg)}
  tr.gap td{color:var(--muted);font-size:10.5px;font-style:italic;max-width:0;overflow:hidden;text-overflow:ellipsis}
  td.badges{width:84px}
  .b{font-size:9.5px;line-height:13px;font-weight:700;border-radius:4px;padding:0 5px;margin-right:3px;display:inline-block}
  .b.exec{background:var(--accent);color:var(--onAccent)}
  .b.pc{background:var(--pcBg);color:var(--pc);border:1px solid var(--pc)}
  .b.sp{background:var(--accent);color:var(--onAccent)}
  .b.stack{background:var(--okBg);color:var(--ok)}
  .b.stale{color:var(--dim);border:1px dashed var(--dim)}
  .lbl{color:var(--accent)}
  td.dimv{color:var(--dim)}
  td.reg2{font-size:10.5px;color:var(--muted)}
  @media (max-width:1450px){.colRegion{display:none}}
  .legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;font-size:11px;color:var(--muted);flex:none}

  .flowBox{flex:1;min-height:0;display:flex}
  .flowSvg{width:100%;height:100%}
  .flowSvg text{font-family:var(--monoFont)}
  .flowSvg .fl{font-size:12px;font-weight:700;fill:var(--chg);paint-order:stroke;stroke:var(--card);stroke-width:4px}
  .flowSvg .anim{stroke-dasharray:6 4;animation:dash .7s linear infinite}
  body.noAnim .flowSvg .anim{animation:none;stroke-dasharray:none}
  @keyframes dash{to{stroke-dashoffset:-10}}
  .sw{display:inline-block;width:16px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}

  .explGrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.95fr) minmax(0,1fr) minmax(0,1.05fr);gap:18px;align-items:start}
  .sub{font-size:11.5px;color:var(--muted);font-weight:600;margin-bottom:5px}
  .bytes{display:flex;gap:8px;margin-bottom:6px}
  .byte{border:1px solid var(--border);border-radius:8px;padding:5px 9px;background:var(--soft);flex:1;min-width:0}
  .byte .addr{font-size:10.5px;color:var(--muted)}
  .byte .hex{font-size:17px;font-weight:700;line-height:1.3}
  .byte .bin{font-size:11px;color:var(--muted)}
  .byte .mean{font-size:11.5px;margin-top:2px}
  .formula{background:var(--soft);border-radius:8px;padding:6px 10px;font-size:12px}
  ol.ops{margin:0;padding-left:20px;font-size:13.5px}
  ol.ops li{margin-bottom:2px}
  .note{background:var(--soft);border-left:3px solid var(--accent);padding:8px 12px;font-size:13px}

  /* Alçak ekranlar (ör. 1366x768 dizüstü): açıklama satırları gizlenir, boşluklar daralır */
  @media (max-height:780px){
    .simPage{gap:7px;padding:8px 12px}.simHead{gap:5px}.legend{display:none}
    .btn{padding:4px 11px;font-size:13px}.iconBtn{height:28px}
    .reg .val{font-size:14px}.pills{margin-top:2px}
    .byte{padding:3px 8px}.byte .hex{font-size:15px}.btn.big{padding:6px 18px;font-size:14px}
    ol.ops{font-size:12.5px}.note{font-size:12px;padding:6px 10px}.formula{font-size:11.5px;padding:4px 8px}
  }
  @media (max-width:1100px),(max-height:560px){
    .simPage{height:auto}.cols{grid-template-columns:1fr;grid-template-rows:none}
    .headRow{flex-wrap:wrap}.headRow .regs{flex-basis:100%;justify-content:flex-start}.regs{flex-wrap:wrap}.keys{display:none}
    table{height:auto}td,th{height:22px}.flowBox{height:440px;flex:none}.explGrid{grid-template-columns:1fr}
    .panel.full{height:auto}.panel.full .explGrid > div{overflow:visible}.tlBox{height:160px !important;flex:none}
    .toolbar{flex-wrap:wrap}.tblWrap{overflow-x:auto}.legend{display:flex}
  }

  /* ---------- Code Lab: editör ---------- */
  .labPage{height:calc(100vh - 52px);display:flex;flex-direction:column;gap:12px;padding:16px 20px;max-width:1800px;margin:0 auto}
  .labHead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .labHead h2{margin:0 12px 0 0;display:flex;align-items:center}
  .ic{width:1.1em;height:1.1em;vertical-align:-0.17em;margin-right:.42em;flex:none}
  .ic.r{margin-right:0;margin-left:.42em}
  .btn{display:inline-flex;align-items:center;justify-content:center}
  .iconBtn{display:inline-flex;align-items:center;justify-content:center}.iconBtn .ic{margin:0;width:17px;height:17px}
  h2 .ic,h3 .ic{color:var(--accent)}
  .cardTop{display:flex;justify-content:space-between;align-items:center}
  .cardIcon{width:38px;height:38px;border-radius:10px;background:var(--accentBg);color:var(--accent);display:flex;align-items:center;justify-content:center}
  .cardIcon .ic{margin:0;width:20px;height:20px}
  .simCard.soon .cardIcon{background:var(--soft);color:var(--muted)}
  .hintKey{font-size:11.5px;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:2px 7px;font-family:var(--monoFont)}
  .editor .cm-editor{flex:1;min-width:0}
  .tlBox{position:relative;height:118px}
  .subHint{font-weight:400;color:var(--dim)}
  .sub .ic{color:var(--accent)}
  .isaWrap{max-width:1180px}
  .isaWrap h1 .ic{color:var(--accent)}
  .isaLegend{margin-top:14px;font-size:13px;color:var(--muted);line-height:1.7}
  .isaLegend b{color:var(--text);font-family:var(--monoFont);font-weight:600}
  .isaBar{position:sticky;top:52px;z-index:5;background:var(--bg);display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:14px 0}
  .isaSearch{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:0 10px;flex:1;min-width:240px}
  .isaSearch .ic{color:var(--muted);margin:0}
  .isaSearch input{border:0;outline:0;background:transparent;color:var(--text);font:inherit;font-size:14px;padding:8px 2px;width:100%}
  .isaCount{font-size:13px;color:var(--muted);font-family:var(--monoFont)}
  .isaGroup{margin-bottom:14px;padding:18px 22px}
  .isaTbl{width:100%;border-collapse:collapse;font-size:13.5px}
  .isaTbl th{text-align:left;font-size:11px;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--border)}
  .isaTbl td{padding:5px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
  .isaTbl tr:not(.famRow):hover td{background:var(--soft)}
  .isaTbl td.num{text-align:center}
  .isaSyn{font-weight:600;white-space:nowrap}
  .isaOp{color:var(--muted)}
  .isaFlags{font-size:12px;color:var(--chg);white-space:nowrap}
  .famRow td{background:var(--soft);font-size:13px;color:var(--muted);padding:7px 8px}
  .famName{display:inline-block;min-width:64px;font-weight:700;color:var(--accent);margin-right:10px}
  .libTbl{width:100%;border-collapse:collapse;font-size:13.5px}
  .libTbl td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top;white-space:normal}
  .libTbl td:first-child{font-weight:600;white-space:nowrap}
  .libTbl td:nth-child(2),.libTbl td:nth-child(3){white-space:nowrap;color:var(--muted)}
  body.gsapOn .flowSvg .anim{animation:none;opacity:.55}
  body.gsapOn .flowSvg .fl{display:none}
  .byte .bin{display:block;font-size:10.5px}
  .flowSvg .pkt{pointer-events:none}
  .labHead select{font:inherit;font-size:14px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:8px;padding:6px 10px}
  .labBody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px}
  .editor{display:flex;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;min-height:0}
  .gutter{margin:0;padding:12px 8px 12px 12px;text-align:right;color:var(--dim);background:var(--soft);border-right:1px solid var(--border);user-select:none;overflow:hidden;font-size:13px;line-height:20px;min-width:48px}
  .gutter .errLn{color:#fff;background:#dc2626;border-radius:3px;padding:0 3px}
  .editor textarea{flex:1;border:0;outline:0;resize:none;padding:12px 14px;font-size:13px;line-height:20px;background:var(--card);color:var(--text);white-space:pre;overflow:auto;tab-size:8}
  .side{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}
  .side .card{padding:14px 16px}
  .side h3{font-size:14px;margin:0 0 8px}
  .errItem{font-size:13px;color:#dc2626;padding:4px 0;cursor:pointer;border-bottom:1px solid var(--border)}
  .okMsg{font-size:13px;color:var(--ok)}
  .ref{font-size:12.5px;color:var(--muted);line-height:1.6}
  .ref code{font-family:var(--monoFont);font-size:12px;color:var(--text);background:var(--soft);border-radius:4px;padding:0 4px}
  .mnList{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .mnList span{font-family:var(--monoFont);font-size:11px;background:var(--soft);border:1px solid var(--border);border-radius:4px;padding:0 5px;color:var(--text)}
  @media (max-width:1000px){.labPage{height:auto}.labBody{grid-template-columns:1fr}.editor{height:520px}}

  /* ---------- RAM ızgara görünümü (Code Lab) ---------- */
  table.ramGrid{table-layout:fixed;text-align:center}
  table.ramGrid th,table.ramGrid td{text-align:center;padding:0;border:1px solid var(--border);font-size:clamp(10px,1.35vh,12px)}
  table.ramGrid th{background:var(--soft)}
  table.ramGrid td.u{color:var(--dim)}
  table.ramGrid td.bk{background:var(--soft)}
  table.ramGrid td.st{background:var(--okBg);color:var(--ok);font-weight:600}
  table.ramGrid td.cg{background:var(--chgBg);color:var(--chg);font-weight:700}
  table.ramGrid td.sp{outline:2px solid var(--accent);outline-offset:-2px;font-weight:700}
  .tblWrap.scroll{overflow:auto}
  .tblWrap.scroll table{height:auto}
  .tblWrap.scroll td{height:22px}
  .stopBadge{background:#fee2e2;color:#b91c1c;border-radius:6px;padding:2px 9px;font-size:12px;margin-left:8px}
  [data-theme="dark"] .stopBadge{background:#450a0a;color:#fca5a5}
</style>
</head>
<body>
<nav id="topNav">
  <div class="brand" onclick="location.hash='#/'"><span class="chip">EEM305</span><span>Simulation Lab</span></div>
  <div class="links">
    <a href="#/" id="navHome"></a>
    <a href="#/instructions" id="navIsa"></a>
    <a href="#/settings" id="navSet"></a>
    <a href="#/about" id="navDev"></a>
  </div>
</nav>
<div id="app"></div>
<footer id="footer"></footer>
<script>
// Dosyanın değiştirilmemiş hâli (ayarları dosyaya yazarken kullanılır)

const LS_KEY = "eem305.settings";
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
let settings = { ...FILE_SETTINGS, ...JSON.parse(ls.get(LS_KEY, "{}")) };
const lang = () => settings.lang;
const t = k => UI[lang()][k];
const L = o => (typeof o === "object" && o !== null && "en" in o) ? o[lang()] : o;
const $ = id => document.getElementById(id);
const app = $("app");
let activeKeyHandler = null;

function setSetting(k, v) { settings[k] = v; ls.set(LS_KEY, JSON.stringify(settings)); route(); }
function effectiveTheme() {
  if (settings.theme === "system") return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  return settings.theme;
}

// ---------- Dosya bağlantısı (IndexedDB'de saklanan dosya tutamacı) ----------
const kv = {
  db() { return new Promise((res, rej) => { const r = indexedDB.open("eem305", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get(k) { try { const db = await this.db(); return await new Promise(res => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => res(undefined); }); } catch (e) { return undefined; } },
  async set(k, v) { try { const db = await this.db(); await new Promise(res => { const tx = db.transaction("kv", "readwrite"); tx.objectStore("kv").put(v, k); tx.oncomplete = res; tx.onerror = res; }); } catch (e) {} },
  async del(k) { try { const db = await this.db(); await new Promise(res => { const tx = db.transaction("kv", "readwrite"); tx.objectStore("kv").delete(k); tx.oncomplete = res; tx.onerror = res; }); } catch (e) {} }
};
function htmlWithSettings() {
  return PRISTINE_HTML.replace(/\/\*SETTINGS_BEGIN\*\/[\s\S]*?\/\*SETTINGS_END\*\//,
    "/*SETTINGS_BEGIN*/const FILE_SETTINGS = " + JSON.stringify(settings) + ";/*SETTINGS_END*/");
}
async function saveSettingsToFile() {
  const html = htmlWithSettings();
  const name = decodeURIComponent(location.pathname.split("/").pop() || "EEM305SimLab.html");
  if (window.showSaveFilePicker) {
    let h = await kv.get("fileHandle");
    if (!h) {
      try { h = await window.showSaveFilePicker({ suggestedName: name, types: [{ description: "HTML", accept: { "text/html": [".html"] } }] }); }
      catch (e) { if (e && e.name === "AbortError") return ""; h = null; }
      if (h) await kv.set("fileHandle", h);
    }
    if (h) {
      let perm = await h.queryPermission({ mode: "readwrite" });
      if (perm !== "granted") perm = await h.requestPermission({ mode: "readwrite" });
      if (perm !== "granted") return t("permDenied");
      const w = await h.createWritable(); await w.write(html); await w.close();
      return t("savedFile") + " " + h.name;
    }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([html], { type: "text/html" }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  return t("savedDownload");
}

function applyChrome() {
  document.documentElement.lang = lang();
  document.documentElement.setAttribute("data-theme", effectiveTheme());
  document.body.classList.toggle("noAnim", !settings.animation);
  document.body.classList.toggle("gsapOn", !!(window.gsap && window.MotionPathPlugin && settings.animation));
  $("navHome").textContent = t("home");
  $("navDev").textContent = t("developer");
  $("navSet").textContent = t("settings");
  $("navIsa").textContent = t("instructions");
  $("footer").textContent = COURSE.code + " " + L(COURSE.name) + " · " + COURSE.instructor + " · " + L(COURSE.uni);
}
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => applyChrome());
document.addEventListener("keydown", e => { if (activeKeyHandler) activeKeyHandler(e); });

function route() {
  applyChrome();
  activeKeyHandler = null;
  const h = location.hash.replace(/^#/, "") || "/";
  ["navHome", "navDev", "navSet", "navIsa"].forEach(id => $(id).classList.remove("active"));
  document.body.classList.remove("simMode");
  if (h === "/sim/call-stack") { document.body.classList.add("simMode"); SimView(app, buildCallStackModel()); return; }
  if (h === "/lab/run") {
    const m = labModel || buildLabModel(getLabCode());
    if (m) { labModel = m; document.body.classList.add("simMode"); SimView(app, m); return; }
    location.hash = "#/lab"; return;
  }
  window.scrollTo(0, 0);
  if (h === "/lab") { renderLab(); return; }
  if (h === "/about" || h === "/developer") { $("navDev").classList.add("active"); renderDeveloper(); return; }
  if (h === "/instructions") { $("navIsa").classList.add("active"); renderInstructions(); return; }
  if (h === "/settings") { $("navSet").classList.add("active"); renderSettings(); return; }
  $("navHome").classList.add("active");
  renderHome();
}

// =====================================================================
// ORTAK SİMÜLASYON GÖRÜNÜMÜ (yerleşik örnek ve Code Lab aynı görünümü kullanır)
// model: { id, title, FLASH, ROW, STEPS, opcodeInfo(row), cards(p,v), ramMode, flowRam(v,s), portBox(v), extra }
// =====================================================================
// Lucide ikonları (gömülü SVG)
const ICONS = /*@@ICONS@@*/{};
const ic = (n, cls) => ICONS[n] ? '<svg class="ic' + (cls ? " " + cls : "") + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[n] + "</svg>" : "";
if (window.gsap) { gsap.config({ nullTargetWarn: false }); if (window.MotionPathPlugin) gsap.registerPlugin(MotionPathPlugin); }
const escHtml = x => String(x).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const h2x = n => (n & 255).toString(16).toUpperCase().padStart(2, "0");
const bin8 = h => parseInt(h, 16).toString(2).padStart(8, "0").replace(/(\d{4})(\d{4})/, "$1 $2");

function SimView(root, model) {
  const { FLASH, ROW, STEPS } = model;
  const grid = model.ramMode === "grid";
  root.innerHTML =
    '<div class="simPage"><div class="simHead">' +
      '<div class="toolbar"><button class="btn" id="bBack">' + ic("arrow-left") + t("back") + "</button>" + (model.extra ? '<button class="btn" id="bExtra">' + ic("pencil-line") + model.extra.label + "</button>" : "") +
      '<span class="chip">' + COURSE.code + '</span><span class="title">' + L(model.title) + '</span><span class="spacer"></span>' +
      '<span class="keys">' + t("keysHint") + '</span><button class="iconBtn" id="bSet" title="' + t("settings") + '">' + ic("settings") + "</button></div>" +
      '<div class="progress"><div id="prog"></div></div>' +
      '<div class="headRow"><div class="stepInfo"><div><span class="stepTitle" id="sTitle"></span><span class="stepSub" id="sSub"></span></div><div class="pills" id="sLine"></div></div>' +
      '<div class="ctrl"><div class="ctrlBtns"><button class="btn big" id="bReset" title="Home">' + ic("rotate-ccw") + t("reset") + '</button><button class="btn big" id="bPrev" title="←">' + ic("chevron-left") + t("prev") +
      '</button><button class="btn primary big" id="bNext" title="→">' + t("next") + ic("chevron-right", "r") + '</button></div><span class="counter mono" id="cnt"></span></div>' +
      '<div class="regs" id="regs"></div></div>' +
    "</div>" +
    '<div class="cols">' +
      '<section class="panel"><div class="pTitle">' + t("flash") + "<small>" + t("flashNote") + '</small></div><div class="tblWrap' + (model.scrollFlash ? " scroll" : "") + '" id="fWrap"><table class="mono" id="fTab"></table></div>' +
        '<div class="legend"><span><span class="b exec">EXEC</span>' + t("lgExec") + '</span><span><span class="b pc">PC</span>' + t("lgPc") + "</span></div></section>" +
      '<section class="panel"><div class="pTitle">' + t("ram") + "<small>" + (grid ? t("ramNoteGrid") : t("ramNote")) + '</small></div><div class="tblWrap"><table class="mono' + (grid ? " ramGrid" : "") + '" id="rTab"></table></div>' +
        (grid
          ? '<div class="legend"><span><span class="b sp">SP</span>' + t("lgSp") + '</span><span><span class="b stack">STACK</span>' + t("lgStack") + '</span><span><span class="b" style="background:var(--chgBg);color:var(--chg)">XX</span>' + t("lgChg") + '</span><span><span class="b" style="background:var(--soft);color:var(--muted)">Rn</span>' + t("lgBank") + "</span></div>"
          : '<div class="legend"><span><span class="b sp">SP</span>' + t("lgSp") + '</span><span><span class="b stack">STACK</span>' + t("lgStack") + '</span><span><span class="b stale">OLD</span>' + t("lgStale") + "</span></div>") +
      "</section>" +
      '<section class="panel"><div class="pTitle">' + t("flowTitle") + "<small>" + t("flowNote") + '</small></div><div class="flowBox" id="flow"></div>' +
        '<div class="legend"><span><span class="sw" style="background:var(--chg)"></span>' + t("lgFlow") + '</span><span><span class="sw" style="background:var(--pc)"></span>' + t("lgPcPtr") + '</span><span><span class="sw" style="background:var(--accent)"></span>' + t("lgSpPtr") + "</span></div></section>" +
      '<section class="panel full"><div class="explGrid">' +
        '<div><div class="sub">' + t("opcode") + '</div><div id="opv"></div></div>' +
        '<div><div class="sub">' + t("inside") + '</div><ol class="ops" id="ops"></ol></div>' +
        '<div><div class="sub">' + t("why") + '</div><div class="note" id="note"></div></div>' +
        '<div><div class="sub">' + ic("activity") + t("timeline") + ' <span class="subHint">· ' + t("timelineHint") + '</span></div><div class="tlBox"><canvas id="tl"></canvas></div></div>' +
      "</div></section>" +
    "</div></div>";

  const stepKey = "eem305.step." + model.id;
  let cur = settings.resume ? (+ls.get(stepKey, 0) || 0) : 0;
  if (cur >= STEPS.length || cur < 0) cur = 0;
  const showVal = (o, n) => o !== n ? '<span class="old">' + o + '</span><span class="chg">' + n + "</span>" : n;

  function render() {
    ls.set(stepKey, cur);
    const s = STEPS[cur], v = s.v, p = (STEPS[cur - 1] || STEPS[0]).v;
    $("cnt").textContent = t("step") + " " + cur + " / " + (STEPS.length - 1);
    $("prog").style.width = (cur / Math.max(1, STEPS.length - 1) * 100) + "%";
    $("sTitle").textContent = L(s.t);
    $("sSub").innerHTML = L(s.sub) + (s.stop ? '<span class="stopBadge">' + t("stopped") + "</span>" : "");
    $("bPrev").disabled = cur === 0;
    $("bNext").disabled = cur === STEPS.length - 1;

    const pcKnown = v.pcl !== "--", pcAddr = v.pch + v.pcl;
    const pcRow = pcKnown ? ROW[pcAddr] : undefined;
    const execTxt = s.row < 0 ? t("noneYet") : FLASH[s.row].asm + " @ " + FLASH[s.row].a + "h";
    const pcTxt = pcKnown ? pcAddr + "h → " + (pcRow !== undefined ? FLASH[pcRow].asm : t("noInstrAt")) : t("loading");
    $("sLine").innerHTML = '<span class="pill exec mono"><b>EXEC</b> ' + execTxt + '</span><span class="pill pcp mono"><b>PC</b> ' + t("pointsTo") + " " + pcTxt + "</span>";

    $("regs").innerHTML = model.cards(p, v).map(c => '<div class="reg' + (c[1] !== c[2] ? " changed" : "") + '"><div class="name">' + c[0] + '</div><div class="val mono">' + showVal(c[1], c[2]) + "</div></div>").join("");

    // Flash tablosu
    let fh = "<tr><th></th><th>" + t("addr") + "</th><th>" + t("bytes") + "</th><th>" + t("label") + "</th><th>" + t("instr") + "</th></tr>";
    FLASH.forEach((f, k) => {
      if (f.gap) { fh += '<tr class="gap"><td colspan="5">' + L(f.gap) + "</td></tr>"; return; }
      const isExec = k === s.row, isPc = k === pcRow;
      fh += '<tr id="fr' + k + '" class="' + (isExec ? "exec" : "") + '"><td class="badges">' + (isExec ? '<span class="b exec">EXEC</span>' : "") + (isPc ? '<span class="b pc">PC</span>' : "") +
            "</td><td>" + f.a + "h</td><td>" + f.b.join(" ") + '</td><td class="lbl">' + (f.lab || "") + "</td><td>" + f.asm + "</td></tr>";
    });
    $("fTab").innerHTML = fh;
    if (model.scrollFlash) { const el = $("fr" + (s.row >= 0 ? s.row : pcRow)); if (el) { const w = $("fWrap"); const top = el.offsetTop - w.clientHeight / 2; w.scrollTop = Math.max(0, top); } }

    // RAM
    const sp = parseInt(v.sp, 16);
    if (grid) {
      let rh = "<tr><th></th>" + [...Array(16)].map((_, i) => "<th>" + i.toString(16).toUpperCase() + "</th>").join("") + "</tr>";
      for (let r = 0; r < 8; r++) {
        rh += "<tr><th>" + r.toString(16).toUpperCase() + "0</th>";
        for (let c = 0; c < 16; c++) {
          const a = r * 16 + c, k = "m" + h2x(a), val = v[k];
          const cls = [];
          if (val === "??") cls.push("u");
          if (a >= v.bank && a < v.bank + 8) cls.push("bk");
          if (a > v.spBase && a <= sp) cls.push("st");
          if (p[k] !== val) cls.push("cg");
          if (a === sp) cls.push("sp");
          rh += '<td class="' + cls.join(" ") + '" title="' + h2x(a) + 'h">' + val + "</td>";
        }
        rh += "</tr>";
      }
      $("rTab").innerHTML = rh;
    } else {
      let rh = "<tr><th>" + t("addr") + "</th><th>" + t("value") + '</th><th class="colRegion">' + t("region") + "</th><th>" + t("state") + "</th></tr>";
      model.RAM_ADDRS.forEach(a => {
        const n = parseInt(a, 16), key = "m" + a;
        const region = t("bank") + " " + (n < 8 ? "0 · R" + n : "1 · R" + (n - 8));
        let tag = "";
        if (n === sp) tag = '<span class="b sp">SP</span>';
        if (n >= 8 && n <= sp) tag += '<span class="b stack">STACK</span>';
        else if (n >= 8 && n > sp && v[key] !== "??") tag = '<span class="b stale">OLD</span>';
        rh += "<tr><td>" + a + "h</td><td" + (n >= 8 && n > sp ? ' class="dimv"' : "") + ">" + showVal(p[key], v[key]) +
              '</td><td class="reg2 colRegion">' + region + "</td><td>" + tag + "</td></tr>";
      });
      $("rTab").innerHTML = rh;
    }

    // Açıklama
    if (s.row < 0 || !FLASH[s.row].b) $("opv").innerHTML = '<div class="formula">' + t("noInstr") + "</div>";
    else {
      const info = model.opcodeInfo(s.row);
      $("opv").innerHTML = '<div class="bytes">' + info.bytes.map(b => '<div class="byte"><div class="addr mono">flash[' + b.addr + ']</div><div class="hex mono">' + b.hex +
        'h <span class="bin">' + bin8(b.hex) + '</span></div><div class="mean">' + L(b.mean) + "</div></div>").join("") + "</div>";
    }
    $("ops").innerHTML = s.ops.map(o => "<li>" + L(o) + "</li>").join("");
    const extra = (s.row >= 0 && FLASH[s.row].b) ? L(model.opcodeInfo(s.row).formula) : "";
    $("note").innerHTML = escHtml(L(s.n)) + (extra ? '<div class="noteExtra">' + escHtml(extra) + "</div>" : "");
    $("flow").innerHTML = drawFlow(model, s, v, pcRow);
    if (chart) chart.update("none");
    animateStep();
  }

  // ---------- Zaman çizelgesi (Chart.js): SP ve A'nın adımlara göre değişimi ----------
  let chart = null;
  if (window.Chart) {
    const css = getComputedStyle(document.documentElement), col = n => css.getPropertyValue(n).trim();
    const spData = STEPS.map((x, i) => ({ x: i, y: parseInt(x.v.sp, 16) })), aData = STEPS.map((x, i) => ({ x: i, y: parseInt(x.v.a, 16) }));
    const spMax = Math.max(...spData.map(d => d.y)), spMin = Math.min(...spData.map(d => d.y));
    const tick = { color: col("--muted"), font: { size: 9.5, family: "JetBrains Mono Var, Consolas, monospace" } };
    const marker = { id: "stepMarker", afterDatasetsDraw(ch) {
      const x = ch.scales.x.getPixelForValue(cur), { top, bottom } = ch.chartArea, c = ch.ctx;
      c.save(); c.strokeStyle = col("--pc"); c.lineWidth = 2; c.beginPath(); c.moveTo(x, top); c.lineTo(x, bottom); c.stroke();
      c.fillStyle = col("--pc"); c.beginPath(); c.arc(x, ch.scales.y.getPixelForValue(spData[cur].y), 3.5, 0, Math.PI * 2); c.fill(); c.restore();
    } };
    chart = new Chart($("tl"), {
      type: "line",
      data: { datasets: [
        { label: "SP", data: spData, stepped: true, borderColor: col("--accent"), backgroundColor: col("--accentBg"), fill: "start", yAxisID: "y", pointRadius: 0, borderWidth: 2 },
        { label: "A", data: aData, stepped: true, borderColor: col("--chg"), borderDash: [4, 3], yAxisID: "y1", pointRadius: 0, borderWidth: 1.5 }
      ] },
      options: {
        animation: false, responsive: true, maintainAspectRatio: false, parsing: true, normalized: true,
        interaction: { mode: "index", intersect: false },
        plugins: {
          legend: { position: "top", align: "end", labels: { boxWidth: 12, boxHeight: 2, color: col("--muted"), font: { size: 10.5 } } },
          tooltip: { callbacks: { title: it => t("step") + " " + it[0].parsed.x, label: c => c.dataset.label + " = " + h2x(c.parsed.y) + "h" } }
        },
        scales: {
          x: { type: "linear", min: 0, max: Math.max(1, STEPS.length - 1), ticks: { ...tick, precision: 0, maxTicksLimit: 8 }, grid: { display: false }, border: { color: col("--border") } },
          y: { position: "left", suggestedMin: Math.max(0, spMin - 1), suggestedMax: spMax + 1, ticks: { ...tick, color: col("--accent"), precision: 0, maxTicksLimit: 4, callback: v => h2x(v) + "h" }, grid: { color: col("--border") }, border: { display: false } },
          y1: { position: "right", min: 0, max: 255, ticks: { ...tick, color: col("--chg"), maxTicksLimit: 3, callback: v => h2x(v) + "h" }, grid: { display: false }, border: { display: false } }
        },
        onClick: (e, els, ch) => { const x = Math.round(ch.scales.x.getValueForPixel(e.x)); if (!isNaN(x)) { cur = Math.min(STEPS.length - 1, Math.max(0, x)); render(); } }
      },
      plugins: [marker]
    });
  }

  // ---------- GSAP: veri paketleri ve değişen register'ların vurgusu ----------
  function animateStep() {
    (window.__pktTl || []).forEach(x => x.kill());
    window.__pktTl = [];
    if (!(window.gsap && settings.animation)) return;
    gsap.fromTo("#regs .reg.changed", { scale: 1.08 }, { scale: 1, duration: 0.5, ease: "back.out(2.5)" });
    const svg = $("flow").querySelector("svg"), NS = "http://www.w3.org/2000/svg";
    if (!svg || !window.MotionPathPlugin) return;
    svg.querySelectorAll("path.anim[data-l]").forEach((path, i) => {
      const l = path.getAttribute("data-l"); if (!l) return;
      const w = 16 + l.length * 7.4;
      const g = document.createElementNS(NS, "g");
      g.setAttribute("class", "pkt");
      g.innerHTML = '<rect x="' + (-w / 2) + '" y="-10" width="' + w + '" height="20" rx="10" fill="var(--chg)"/><text x="0" y="4" text-anchor="middle" font-size="11.5" font-weight="700" fill="var(--card)">' + escHtml(l) + "</text>";
      svg.appendChild(g);
      const tl = gsap.timeline({ repeat: -1, repeatDelay: 0.6, delay: i * 0.3 });
      // Paket yol boyunca ilerler ve hedefte bekler (etiket her an görünür kalır)
      tl.fromTo(g, { opacity: 0.35 }, { opacity: 1, duration: 0.2 })
        .to(g, { duration: 1.1, ease: "power1.inOut", motionPath: { path, align: path, alignOrigin: [0.5, 0.5] } }, 0);
      window.__pktTl.push(tl);
    });
  }

  const go = d => { const n = Math.min(STEPS.length - 1, Math.max(0, cur + d)); if (n !== cur) { cur = n; render(); } };
  $("bNext").onclick = () => go(1);
  $("bPrev").onclick = () => go(-1);
  $("bReset").onclick = () => { cur = 0; render(); };
  $("bBack").onclick = () => location.hash = "#/";
  $("bSet").onclick = () => location.hash = "#/settings";
  if (model.extra) $("bExtra").onclick = model.extra.onClick;
  activeKeyHandler = e => {
    if (e.key === "ArrowRight") { e.preventDefault(); go(1); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); go(-1); }
    else if (e.key === "Home") { e.preventDefault(); cur = 0; render(); }
    else if (e.key === "End") { e.preventDefault(); cur = STEPS.length - 1; render(); }
  };
  render();
}

// ---------------------------------------------------------------------
// Grafiksel veri akışı: Flash | CPU (IR, PC, SP, A, Port) | RAM
// CPU içindeki transferler, kutuları birbirine bağlayan iç veri yolu üzerinden gösterilir.
// ---------------------------------------------------------------------
function drawFlow(model, s, v, pcRow) {
  const FLASH = model.FLASH;
  const esc = x => String(x).replace(/</g, "&lt;");
  const FX = 6, FW = 222, CX = 270, CW = 192, BX = 296, BW = 152, RX = 506, RW = 208;
  const busX = 282;
  // Flash satırları (en fazla 14; uzun programlarda işletilen satırın etrafı)
  let fr = FLASH.map((f, k) => ({ f, k })).filter(x => x.f.a && x.f.b);
  if (fr.length > 14) {
    const focus = s.row >= 0 ? s.row : (pcRow ?? 0);
    const i = Math.max(0, fr.findIndex(x => x.k >= focus));
    const start = Math.min(Math.max(0, i - 6), fr.length - 14);
    fr = fr.slice(start, start + 14);
  }
  const fIdx = k => fr.findIndex(x => x.k === k);
  const fY = k => 46 + fIdx(k) * 29 + 12;
  const ramAddrs = model.flowRam(v, s);
  const ramY = [50, 98, 146, 194, 242, 352];
  const rY = a => { const i = ramAddrs.indexOf(a); return i < 0 ? 0 : ramY[i] + 20; };
  const sp = parseInt(v.sp, 16), spBase = v.spBase ?? 7;
  const box = { ir: 52, pc: 136, sp: 220, a: 304, p1: 388 };
  const mid = k => box[k] + 22;
  // İnce, sabit boyutlu ok başı (çizgi kalınlığından bağımsız)
  const mk = (id, c) => '<marker id="' + id + '" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1.5 L9,5 L1,8.5 L3.2,5 z" fill="' + c + '" stroke="' + c + '" stroke-width="0.6" stroke-linejoin="round"/></marker>';
  let g = "<defs>" + mk("mChg", "var(--chg)") + mk("mPc", "var(--pc)") + mk("mSp", "var(--accent)") + "</defs>";
  const blk = (x, w, title) => '<rect x="' + x + '" y="4" width="' + w + '" height="458" rx="12" fill="var(--soft)" stroke="var(--border)"/><text x="' + (x + w / 2) + '" y="27" text-anchor="middle" font-size="12" font-weight="700" fill="var(--muted)">' + title + "</text>";
  g += blk(FX, FW, t("flashShort")) + blk(CX, CW, t("cpu")) + blk(RX, RW, t("ramShort"));
  // İç veri yolu
  g += '<line x1="' + busX + '" y1="' + mid("ir") + '" x2="' + busX + '" y2="' + mid("p1") + '" stroke="var(--border)" stroke-width="5" stroke-linecap="round"/>';
  ["ir", "pc", "sp", "a", "p1"].forEach(k => g += '<line x1="' + busX + '" y1="' + mid(k) + '" x2="' + BX + '" y2="' + mid(k) + '" stroke="var(--border)" stroke-width="3"/>');
  g += '<text x="' + (CX + CW / 2) + '" y="452" text-anchor="middle" font-size="10" fill="var(--muted)">' + t("bus") + "</text>";
  fr.forEach(x => {
    const y = fY(x.k) - 12, ex = x.k === s.row, isPc = x.k === pcRow;
    g += '<rect x="' + (FX + 6) + '" y="' + y + '" width="' + (FW - 12) + '" height="24" rx="5" fill="' + (ex ? "var(--accentBg)" : "var(--card)") + '" stroke="' + (isPc ? "var(--pc)" : "var(--border)") + '" stroke-width="' + (isPc ? 2 : 1) + '"/>' +
         '<text x="' + (FX + 13) + '" y="' + (y + 16) + '" font-size="11.5" fill="var(--muted)">' + x.f.a + '</text><text x="' + (FX + 56) + '" y="' + (y + 16) + '" font-size="12" fill="' + (ex ? "var(--accent)" : "var(--text)") + '" font-weight="' + (ex ? 700 : 400) + '">' + esc(x.f.asm.length > 18 ? x.f.asm.slice(0, 17) + "…" : x.f.asm) + "</text>";
  });
  const port = model.portBox(v);
  const cb = (key, label, val, hl) => '<rect x="' + BX + '" y="' + box[key] + '" width="' + BW + '" height="44" rx="8" fill="var(--card)" stroke="' + (hl || "var(--border)") + '" stroke-width="' + (hl ? 2 : 1) + '"/>' +
    '<text x="' + (BX + 11) + '" y="' + (box[key] + 27) + '" font-size="12" fill="var(--muted)" font-weight="700">' + label + '</text><text x="' + (BX + BW - 11) + '" y="' + (box[key] + 28) + '" font-size="15" text-anchor="end" fill="var(--text)" font-weight="700">' + val + "</text>";
  g += cb("ir", "IR", s.row >= 0 && FLASH[s.row].b ? FLASH[s.row].b.join(" ") : "--") + cb("pc", "PC", v.pch + " " + v.pcl, "var(--pc)") + cb("sp", "SP", v.sp + "h", "var(--accent)") + cb("a", "A", v.a + "h") + cb("p1", port[0], port[1]);
  ramAddrs.forEach((a, i) => {
    const y = ramY[i], n = parseInt(a, 16), isSp = n === sp, inStack = n > spBase && n <= sp, val = v["m" + a] ?? "??", stale = n > spBase && n > sp && val !== "??";
    g += '<rect x="' + (RX + 8) + '" y="' + y + '" width="' + (RW - 16) + '" height="40" rx="7" fill="' + (inStack ? "var(--okBg)" : "var(--card)") + '" stroke="' + (isSp ? "var(--accent)" : "var(--border)") + '" stroke-width="' + (isSp ? 2 : 1) + '"/>' +
         '<text x="' + (RX + 18) + '" y="' + (y + 25) + '" font-size="12" fill="var(--muted)">' + a + 'h</text><text x="' + (RX + RW - 18) + '" y="' + (y + 26) + '" font-size="15" text-anchor="end" font-weight="700" fill="' + (stale ? "var(--dim)" : "var(--text)") + '">' + val + "</text>";
  });
  g += '<text x="' + (RX + RW / 2) + '" y="318" text-anchor="middle" font-size="12" fill="var(--muted)">⋮</text>';
  const FR = FX + FW, RL = RX + 8, BR = BX + BW;
  // Sabit işaretçiler: PC → flash, SP → RAM
  if (pcRow !== undefined && v.pcl !== "--" && fIdx(pcRow) >= 0) {
    const y = fY(pcRow);
    g += '<path d="M' + BX + "," + (mid("pc") + 8) + " L" + (busX + 8) + "," + (mid("pc") + 8) + " C" + (FR + 34) + "," + (mid("pc") + 8) + " " + (FR + 26) + "," + y + " " + FR + "," + y + '" fill="none" stroke="var(--pc)" stroke-width="1.6" marker-end="url(#mPc)"/>';
  }
  if (rY(v.sp)) g += '<path d="M' + BR + "," + mid("sp") + " C" + (BR + 34) + "," + mid("sp") + " " + (RL - 30) + "," + rY(v.sp) + " " + RL + "," + rY(v.sp) + '" fill="none" stroke="var(--accent)" stroke-width="1.6" marker-end="url(#mSp)"/>';
  // Bu adımdaki veri hareketleri
  const flow = (d, lx, ly, l, anchor) => '<path class="anim" data-l="' + esc(l || "") + '" d="' + d + '" fill="none" stroke="var(--chg)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#mChg)"/>' +
    (l ? '<text class="fl" x="' + lx + '" y="' + ly + '" text-anchor="' + (anchor || "middle") + '">' + esc(l) + "</text>" : "");
  const midX = (FR + busX) / 2, midR = (BR + RL) / 2;
  const alias = f => ({ irA: { k: "bus", from: "ir", to: "a", l: f.l }, aP1: { k: "bus", from: "a", to: "p1", l: f.l }, irRam: { k: "toRam", from: "ir", row: f.row, l: f.l },
    push: { k: "toRam", from: "pc", row: f.row, l: f.l }, pop: { k: "fromRam", to: "pc", row: f.row, l: f.l } })[f.k] || f;
  (s.fx || []).map(alias).forEach(f => {
    if (f.k === "fetch" && s.row >= 0 && fIdx(s.row) >= 0) {
      const y = fY(s.row), ty = box.ir + 12;
      g += flow("M" + FR + "," + y + " C" + (FR + 40) + "," + y + " " + (BX - 40) + "," + ty + " " + BX + "," + ty, midX, Math.min(y, ty) - 8, FLASH[s.row].b.join(" "));
    }
    if (f.k === "pcSet") g += flow("M" + (BX + 76) + "," + (box.ir + 44) + " L" + (BX + 76) + "," + box.pc, BX + 84, box.ir + 70, f.l, "start");
    if (f.k === "bus" && box[f.from] !== undefined && box[f.to] !== undefined && f.from !== f.to) {
      const y1 = mid(f.from), y2 = mid(f.to);
      g += flow("M" + BX + "," + y1 + " L" + busX + "," + y1 + " L" + busX + "," + y2 + " L" + BX + "," + y2, BX + BW / 2, box[f.to] - 8, f.l);
    }
    if (f.k === "toRam" && rY(f.row)) {
      const y1 = mid(f.from), y2 = rY(f.row);
      g += flow("M" + BR + "," + y1 + " C" + (BR + 34) + "," + y1 + " " + (RL - 34) + "," + y2 + " " + RL + "," + y2, midR, Math.min(y1, y2) - 8, f.l);
    }
    if (f.k === "fromRam" && rY(f.row)) {
      const y1 = rY(f.row), y2 = mid(f.to);
      g += flow("M" + RL + "," + y1 + " C" + (RL - 34) + "," + y1 + " " + (BR + 34) + "," + y2 + " " + BR + "," + y2, midR, Math.min(y1, y2) - 8, f.l);
    }
  });
  return '<svg class="flowSvg" viewBox="0 0 720 466" preserveAspectRatio="xMidYMid meet" role="img" aria-label="data flow">' + g + "</svg>";
}

// =====================================================================
// SİMÜLASYON 1: ACALL / LCALL / RET (yerleşik, açıklamaları elle yazılmış örnek)
// =====================================================================
function buildCallStackModel() {
  const hex2 = n => n.toString(16).toUpperCase().padStart(2, "0");
  const bin8 = h => parseInt(h, 16).toString(2).padStart(8, "0").replace(/(\d{4})(\d{4})/, "$1 $2");
  const splitPc = v => ({ pch: v.slice(0, 2), pcl: v.slice(2) });
  const T2 = (en, tr) => ({ en, tr });

  // Flash içeriği
  const FLASH = [
    { a: "0000", b: ["02","00","30"], lab: "",        asm: "LJMP Main",     op: "ljmp" },
    { gap: T2("0003h–002Fh: interrupt vectors (INT0, T0, INT1, T1, serial)", "0003h–002Fh: kesme vektörleri (INT0, T0, INT1, T1, seri port)") },
    { a: "0030", b: ["74","05"],      lab: "Main:",   asm: "MOV A,#05h",    op: "movAimm" },
    { a: "0032", b: ["11","40"],      lab: "",        asm: "ACALL AddSub",  op: "acall" },
    { a: "0034", b: ["00"],           lab: "",        asm: "NOP",           op: "nop" },
    { a: "0035", b: ["78","10"],      lab: "",        asm: "MOV R0,#10h",   op: "movR0imm" },
    { a: "0037", b: ["12","09","00"], lab: "",        asm: "LCALL FarSub",  op: "lcall" },
    { a: "003A", b: ["80","FE"],      lab: "",        asm: "SJMP $",        op: "sjmp" },
    { gap: T2("003Ch–003Fh: unused", "003Ch–003Fh: boş") },
    { a: "0040", b: ["24","03"],      lab: "AddSub:", asm: "ADD A,#03h",    op: "addAimm" },
    { a: "0042", b: ["00"],           lab: "",        asm: "NOP",           op: "nop" },
    { a: "0043", b: ["12","09","00"], lab: "",        asm: "LCALL FarSub",  op: "lcall" },
    { a: "0046", b: ["22"],           lab: "",        asm: "RET",           op: "ret" },
    { gap: T2("0047h–08FFh: other code / unused (second 2 KB block starts at 0800h)", "0047h–08FFh: diğer kod / boş (ikinci 2 KB blok 0800h'de başlar)") },
    { a: "0900", b: ["F5","90"],      lab: "FarSub:", asm: "MOV P1,A",      op: "movP1A" },
    { a: "0902", b: ["00"],           lab: "",        asm: "NOP",           op: "nop" },
    { a: "0903", b: ["22"],           lab: "",        asm: "RET",           op: "ret" }
  ];
  const ROW = {};
  FLASH.forEach((f, k) => { if (f.a) ROW[f.a] = k; });

  // Opcode açılımı
  function opcodeInfo(row) {
    const f = FLASH[row], addr = parseInt(f.a, 16);
    const bx = (i, mean) => ({ addr: hex2((addr + i) >> 8) + hex2((addr + i) & 0xff) + "h", hex: f.b[i], mean: L(mean) });
    switch (f.op) {
      case "ljmp": return { bytes: [bx(0, T2("Opcode: LJMP addr16", "Opcode: LJMP addr16")), bx(1, T2("Target address high byte = " + f.b[1] + "h", "Hedef adresin yüksek byte'ı = " + f.b[1] + "h")), bx(2, T2("Target address low byte = " + f.b[2] + "h → " + f.b[1] + f.b[2] + "h", "Hedef adresin düşük byte'ı = " + f.b[2] + "h → " + f.b[1] + f.b[2] + "h"))],
        formula: L(T2("3 bytes · Target = 00h:30h = 0030h · PC ← 0030h (no return address saved)", "3 byte · Hedef = 00h:30h = 0030h · PC ← 0030h (dönüş adresi saklanmaz)")) };
      case "movAimm": return { bytes: [bx(0, T2("Opcode: MOV A,#data", "Opcode: MOV A,#data")), bx(1, T2("Immediate data = 05h", "Anlık veri = 05h"))], formula: L(T2("2 bytes · A ← #05h", "2 byte · A ← #05h")) };
      case "addAimm": return { bytes: [bx(0, T2("Opcode: ADD A,#data", "Opcode: ADD A,#data")), bx(1, T2("Immediate data = 03h", "Anlık veri = 03h"))], formula: L(T2("2 bytes · A ← A + #03h", "2 byte · A ← A + #03h")) };
      case "movR0imm": return { bytes: [bx(0, T2("Opcode: MOV Rn,#data → 0111 1rrr, rrr = 000 → R0", "Opcode: MOV Rn,#data → 0111 1rrr, rrr = 000 → R0")), bx(1, T2("Immediate data = 10h", "Anlık veri = 10h"))],
        formula: L(T2("2 bytes · R0 ← #10h · Bank 0 is selected, so R0 = RAM[00h]", "2 byte · R0 ← #10h · Bank 0 seçili, yani R0 = RAM[00h]")) };
      case "movP1A": return { bytes: [bx(0, T2("Opcode: MOV direct,A", "Opcode: MOV direct,A")), bx(1, T2("Direct address 90h = P1 (SFR)", "Direct adres 90h = P1 (SFR)"))], formula: L(T2("2 bytes · SFR[90h] ← A, i.e. P1 ← A", "2 byte · SFR[90h] ← A, yani P1 ← A")) };
      case "nop": return { bytes: [bx(0, T2("Opcode: NOP", "Opcode: NOP"))], formula: L(T2("1 byte · Does nothing for 1 machine cycle · PC ← PC + 1", "1 byte · 1 makine çevrimi boyunca hiçbir şey yapmaz · PC ← PC + 1")) };
      case "ret": return { bytes: [bx(0, T2("Opcode: RET", "Opcode: RET"))], formula: L(T2("1 byte · PCH ← (SP), SP ← SP−1 · PCL ← (SP), SP ← SP−1", "1 byte · PCH ← (SP), SP ← SP−1 · PCL ← (SP), SP ← SP−1")) };
      case "acall": {
        const hi3 = parseInt(f.b[0], 16) >> 5, b3 = hi3.toString(2).padStart(3, "0");
        const target = ((addr + 2) & 0xF800) | (hi3 << 8) | parseInt(f.b[1], 16);
        const tg = hex2(target >> 8) + hex2(target & 0xff) + "h";
        return { bytes: [bx(0, T2("a10 a9 a8 = " + b3 + " · 1 0001 = ACALL opcode", "a10 a9 a8 = " + b3 + " · 1 0001 = ACALL opcode")), bx(1, T2("a7…a0 = " + f.b[1] + "h", "a7…a0 = " + f.b[1] + "h"))],
          formula: L(T2("2 bytes · 11-bit address = " + b3 + " " + bin8(f.b[1]) + " · Target = upper 5 bits of (PC+2) + 11 bits = " + tg + " · Only within the same 2 KB block",
                        "2 byte · 11 bit adres = " + b3 + " " + bin8(f.b[1]) + " · Hedef = (PC+2)'nin üst 5 biti + 11 bit = " + tg + " · Sadece aynı 2 KB blok içinde")) };
      }
      case "lcall": return { bytes: [bx(0, T2("Opcode: LCALL addr16", "Opcode: LCALL addr16")), bx(1, T2("Target address high byte = " + f.b[1] + "h", "Hedef adresin yüksek byte'ı = " + f.b[1] + "h")), bx(2, T2("Target address low byte = " + f.b[2] + "h → " + f.b[1] + f.b[2] + "h", "Hedef adresin düşük byte'ı = " + f.b[2] + "h → " + f.b[1] + f.b[2] + "h"))],
        formula: L(T2("3 bytes · Target = 09h:00h = 0900h · Anywhere in 64 KB", "3 byte · Hedef = 09h:00h = 0900h · 64 KB'ın herhangi bir yeri")) };
      case "sjmp": return { bytes: [bx(0, T2("Opcode: SJMP rel", "Opcode: SJMP rel")), bx(1, T2("rel = FEh = −2 (signed)", "rel = FEh = −2 (işaretli)"))],
        formula: L(T2("2 bytes · Target = (PC+2) + rel = 003Ch − 2 = 003Ah · Jumps to itself: endless loop", "2 byte · Hedef = (PC+2) + rel = 003Ch − 2 = 003Ah · Kendine atlar: sonsuz döngü")) };
    }
  }

  // CALL mikro adımları
  function callSteps(row, name, len, at, ret, tgt, sp0) {
    const s1 = hex2(parseInt(sp0, 16) + 1), s2 = hex2(parseInt(sp0, 16) + 2), r = splitPc(ret);
    const range = len === 2
      ? T2("ACALL encodes the target in 11 bits, so it can only jump within the same 2 KB block.", "ACALL hedefi 11 bitle kodlar, bu yüzden sadece aynı 2 KB blok içine atlayabilir.")
      : T2("LCALL encodes a full 16-bit target, so it can reach anywhere in the 64 KB program memory.", "LCALL hedefi 16 bitle kodlar, 64 KB program belleğinin herhangi bir yerine atlayabilir.");
    return [
      { row, t: name, sub: T2("Micro-step 1/4 · Compute the return address", "Mikro adım 1/4 · Dönüş adresinin hesaplanması"), d: { ...r }, fx: [{ k: "fetch" }, { k: "pcSet", l: "PC + " + len }],
        ops: [T2("Fetch the instruction's " + len + " bytes from flash", "Komutun " + len + " byte'ı flash'tan okunur"), T2("PC ← " + at + "h + " + len + " = " + ret + "h", "PC ← " + at + "h + " + len + " = " + ret + "h")],
        n: T2("Fetching always advances PC by the instruction length, so PC now holds " + ret + "h — the instruction right after the CALL. That is exactly the return address. No jump has happened yet.",
              "Komut okunurken PC her zaman komut uzunluğu kadar artar. PC şu an " + ret + "h, yani CALL'dan sonraki komut: bu tam olarak dönüş adresidir. Henüz atlama yapılmadı.") },
      { row, t: name, sub: T2("Micro-step 2/4 · Push PCL", "Mikro adım 2/4 · PCL stack'e yazılıyor"), d: { sp: s1, ["m" + s1]: r.pcl }, fx: [{ k: "push", row: s1, l: "PCL " + r.pcl + "h" }],
        ops: [T2("SP ← " + sp0 + "h + 1 = " + s1 + "h", "SP ← " + sp0 + "h + 1 = " + s1 + "h"), T2("RAM[" + s1 + "h] ← PCL = " + r.pcl + "h", "RAM[" + s1 + "h] ← PCL = " + r.pcl + "h")],
        n: T2("The low byte goes first. A RAM cell holds 1 byte but PC is 2 bytes, so the return address is split across two cells.",
              "Önce düşük byte yazılır. RAM hücresi 1 byte, PC ise 2 byte olduğu için dönüş adresi iki hücreye bölünür.") },
      { row, t: name, sub: T2("Micro-step 3/4 · Push PCH", "Mikro adım 3/4 · PCH stack'e yazılıyor"), d: { sp: s2, ["m" + s2]: r.pch }, fx: [{ k: "push", row: s2, l: "PCH " + r.pch + "h" }],
        ops: [T2("SP ← " + s1 + "h + 1 = " + s2 + "h", "SP ← " + s1 + "h + 1 = " + s2 + "h"), T2("RAM[" + s2 + "h] ← PCH = " + r.pch + "h", "RAM[" + s2 + "h] ← PCH = " + r.pch + "h")],
        n: T2("Return address " + ret + "h is now on the stack: " + s1 + "h holds PCL (" + r.pcl + "h), " + s2 + "h holds PCH (" + r.pch + "h). SP points to the last byte written.",
              "Dönüş adresi " + ret + "h artık stack'te: " + s1 + "h'de PCL (" + r.pcl + "h), " + s2 + "h'de PCH (" + r.pch + "h). SP son yazılan byte'ı gösteriyor.") },
      { row, t: name, sub: T2("Micro-step 4/4 · Jump to the subroutine", "Mikro adım 4/4 · Alt programa atlama"), d: { ...splitPc(tgt) }, fx: [{ k: "pcSet", l: "PC ← " + tgt + "h" }],
        ops: [T2("PC ← " + tgt + "h", "PC ← " + tgt + "h")], n: range }
    ];
  }

  // RET mikro adımları
  function retSteps(row, at, sp0, vh, vl) {
    const s1 = hex2(parseInt(sp0, 16) - 1), s2 = hex2(parseInt(sp0, 16) - 2);
    const name = T2("RET at " + at + "h", at + "h'deki RET");
    return [
      { row, t: name, sub: T2("Micro-step 1/2 · Pop PCH", "Mikro adım 1/2 · PCH stack'ten okunuyor"), d: { pch: vh, pcl: "--", sp: s1 }, fx: [{ k: "fetch" }, { k: "pop", row: sp0, l: "PCH " + vh + "h" }],
        ops: [T2("PCH ← RAM[" + sp0 + "h] = " + vh + "h", "PCH ← RAM[" + sp0 + "h] = " + vh + "h"), T2("SP ← " + sp0 + "h − 1 = " + s1 + "h", "SP ← " + sp0 + "h − 1 = " + s1 + "h")],
        n: T2("RET reverses the CALL: the last byte written (PCH) is read first. PCL is not loaded yet (--).",
              "RET, CALL'ın tersini yapar: en son yazılan byte (PCH) ilk okunur. PCL henüz yüklenmedi (--).") },
      { row, t: name, sub: T2("Micro-step 2/2 · Pop PCL", "Mikro adım 2/2 · PCL stack'ten okunuyor"), d: { pcl: vl, sp: s2 }, fx: [{ k: "pop", row: s1, l: "PCL " + vl + "h" }],
        ops: [T2("PCL ← RAM[" + s1 + "h] = " + vl + "h", "PCL ← RAM[" + s1 + "h] = " + vl + "h"), T2("SP ← " + s1 + "h − 1 = " + s2 + "h", "SP ← " + s1 + "h − 1 = " + s2 + "h"), T2("PC = " + vh + vl + "h", "PC = " + vh + vl + "h")],
        n: T2("Return complete. The RAM cells were NOT erased — only SP moved down. Those cells now hold stale data.",
              "Dönüş tamamlandı. RAM'deki değerler SİLİNMEDİ, sadece SP aşağı indi. O hücreler artık eski veri tutuyor.") }
    ];
  }

  const one = (row, en, tr, sub, d, ops, n, fx) => ({ row, t: T2(en, tr), sub, d, ops, n, fx });
  const F_ = (pc, extra) => [{ k: "fetch" }, { k: "pcSet", l: pc }].concat(extra || []);
  const DEFS = [
    { row: -1, t: T2("Reset", "Reset"), sub: T2("Power-on / reset state", "Güç verme / reset durumu"), d: {},
      ops: [T2("PC = 0000h (reset vector)", "PC = 0000h (reset vektörü)"), T2("SP = 07h (reset value)", "SP = 07h (reset değeri)"), T2("A = 00h, P1 = FFh (reset values)", "A = 00h, P1 = FFh (reset değerleri)")],
      n: T2("The CPU always starts at 0000h. Interrupt vectors begin at 0003h, so only a jump to the main program fits at 0000h. RAM contents are undefined (??).",
            "İşlemci her zaman 0000h'den başlar. Kesme vektörleri 0003h'de başladığı için 0000h'ye sadece ana programa atlayan bir komut sığar. RAM içeriği belirsiz (??).") , fx: [] },
    one(ROW["0000"], "LJMP Main", "LJMP Main", T2("3 bytes", "3 byte"), splitPc("0030"),
      [T2("Fetch 02h 00h 30h from flash", "Flash'tan 02h 00h 30h okunur"), T2("PC ← 0030h", "PC ← 0030h")],
      T2("A JMP does not save a return address: SP and RAM are untouched. That is the key difference between JMP and CALL.", "JMP dönüş adresi saklamaz: SP ve RAM değişmez. CALL ile JMP arasındaki temel fark budur."), F_("PC ← 0030h")),
    one(ROW["0030"], "MOV A,#05h", "MOV A,#05h", T2("2 bytes", "2 byte"), { ...splitPc("0032"), a: "05" },
      [T2("PC ← 0030h + 2 = 0032h", "PC ← 0030h + 2 = 0032h"), T2("A ← 05h", "A ← 05h")],
      T2("An ordinary instruction: PC advances by the instruction length and the stack is not involved.", "Sıradan bir komut: PC komut uzunluğu kadar artar, stack'e dokunulmaz."), F_("PC + 2", [{ k: "irA", l: "05h" }])),
    ...callSteps(ROW["0032"], T2("ACALL AddSub", "ACALL AddSub"), 2, "0032", "0034", "0040", "07"),
    one(ROW["0040"], "ADD A,#03h", "ADD A,#03h", T2("2 bytes · inside AddSub", "2 byte · AddSub içinde"), { ...splitPc("0042"), a: "08" },
      [T2("A ← 05h + 03h = 08h", "A ← 05h + 03h = 08h"), T2("PC ← 0040h + 2 = 0042h", "PC ← 0040h + 2 = 0042h")],
      T2("We are inside AddSub. One return address (2 bytes) is on the stack: SP = 09h.", "AddSub alt programındayız. Stack'te 1 dönüş adresi (2 byte) var: SP = 09h."), F_("PC + 2", [{ k: "irA", l: "A + 03h" }])),
    one(ROW["0042"], "NOP", "NOP", T2("1 byte", "1 byte"), splitPc("0043"),
      [T2("No operation", "Hiçbir işlem yapılmaz"), T2("PC ← 0042h + 1 = 0043h", "PC ← 0042h + 1 = 0043h")],
      T2("NOP only advances PC by 1 and waits one machine cycle.", "NOP sadece PC'yi 1 artırır ve 1 makine çevrimi bekler."), F_("PC + 1")),
    ...callSteps(ROW["0043"], T2("LCALL FarSub (nested)", "LCALL FarSub (iç içe)"), 3, "0043", "0046", "0900", "09"),
    one(ROW["0900"], "MOV P1,A", "MOV P1,A", T2("2 bytes · inside FarSub", "2 byte · FarSub içinde"), { ...splitPc("0902"), p1: "08" },
      [T2("P1 ← A = 08h", "P1 ← A = 08h"), T2("PC ← 0900h + 2 = 0902h", "PC ← 0900h + 2 = 0902h")],
      T2("Innermost subroutine. Two return addresses (4 bytes) are stacked: SP = 0Bh.", "En içteki alt program. Stack'te 2 dönüş adresi (4 byte) üst üste: SP = 0Bh."), F_("PC + 2", [{ k: "aP1", l: "08h" }])),
    one(ROW["0902"], "NOP", "NOP", T2("1 byte", "1 byte"), splitPc("0903"),
      [T2("PC ← 0902h + 1 = 0903h", "PC ← 0902h + 1 = 0903h")], T2("Only PC changed.", "Sadece PC değişti."), F_("PC + 1")),
    ...retSteps(ROW["0903"], "0903", "0B", "00", "46"),
    ...retSteps(ROW["0046"], "0046", "09", "00", "34"),
    one(ROW["0034"], "NOP", "NOP", T2("1 byte · first instruction between ACALL and LCALL", "1 byte · ACALL ile LCALL arasındaki ilk komut"), splitPc("0035"),
      [T2("PC ← 0034h + 1 = 0035h", "PC ← 0034h + 1 = 0035h")],
      T2("Back in the main program. The stack is empty (SP = 07h) but stale values remain in 08h–0Bh.", "Ana programa dönüldü. Stack boş (SP = 07h) ama 08h–0Bh'de eski değerler duruyor."), F_("PC + 1")),
    one(ROW["0035"], "MOV R0,#10h", "MOV R0,#10h", T2("2 bytes", "2 byte"), { ...splitPc("0037"), m00: "10" },
      [T2("RAM[00h] ← 10h", "RAM[00h] ← 10h"), T2("PC ← 0035h + 2 = 0037h", "PC ← 0035h + 2 = 0037h")],
      T2("R0 is really RAM address 00h (Bank 0). If Bank 1 were selected, R0 would be 08h and this write would destroy a return address on the stack.",
         "R0 aslında RAM'in 00h adresidir (Bank 0). Bank 1 seçili olsaydı R0 = 08h olurdu ve bu yazma stack'teki dönüş adresini bozardı."), F_("PC + 2", [{ k: "irRam", row: "00", l: "10h" }])),
    ...callSteps(ROW["0037"], T2("LCALL FarSub (from main)", "LCALL FarSub (ana programdan)"), 3, "0037", "003A", "0900", "07"),
    one(ROW["0900"], "MOV P1,A", "MOV P1,A", T2("2 bytes", "2 byte"), splitPc("0902"),
      [T2("P1 ← A = 08h (already 08h, no visible change)", "P1 ← A = 08h (zaten 08h, görünür değişim yok)"), T2("PC ← 0902h", "PC ← 0902h")],
      T2("46h/00h are still sitting in 0Ah/0Bh, but with SP = 09h they are no longer part of the stack.", "0Ah/0Bh'deki 46h/00h hâlâ duruyor ama SP = 09h olduğu için stack'in parçası değil."), F_("PC + 2", [{ k: "aP1", l: "08h" }])),
    one(ROW["0902"], "NOP", "NOP", T2("1 byte", "1 byte"), splitPc("0903"),
      [T2("PC ← 0903h", "PC ← 0903h")], T2("Same subroutine, called from a different place this time.", "Aynı alt program, bu sefer farklı bir yerden çağrıldı."), F_("PC + 1")),
    ...retSteps(ROW["0903"], "0903", "09", "00", "3A"),
    one(ROW["003A"], "SJMP $", "SJMP $", T2("2 bytes · endless loop", "2 byte · sonsuz döngü"), {},
      [T2("Target = 003Ch + (−2) = 003Ah", "Hedef = 003Ch + (−2) = 003Ah"), T2("PC stays at 003Ah", "PC 003Ah'de kalır")],
      T2("The same RET (0903h) returned to 0046h the first time and to 003Ah the second time: the return address lives on the stack, not in the code. Not a single flash byte changed.",
         "Aynı RET (0903h) ilk seferde 0046h'ye, ikincisinde 003Ah'ye döndü: dönüş adresi kodda değil, stack'te yazılı. Flash'ta tek bir byte bile değişmedi."), F_("PC ← 003Ah"))
  ];

  // Durumları oluştur
  const RAM_ADDRS = [];
  for (let i = 0x0F; i >= 0; i--) RAM_ADDRS.push(hex2(i));
  let st = { pch: "00", pcl: "00", sp: "07", a: "00", p1: "FF" };
  RAM_ADDRS.forEach(a => st["m" + a] = "??");
  const STEPS = DEFS.map(s => { st = { ...st, ...s.d }; return { ...s, v: { ...st } }; });
  const sim = SIMULATIONS.find(s => s.id === "call-stack");

  return {
    id: "call-stack", title: sim.title, FLASH, ROW, STEPS, RAM_ADDRS, ramMode: "table",
    opcodeInfo,
    cards: (p, v) => {
      const pk = v.pcl !== "--", po = p.pcl === "--" ? p.pch + "--" : p.pch + p.pcl;
      return [[t("pch"), p.pch, v.pch], [t("pcl"), p.pcl, v.pcl], [t("pc16"), po + "h", (pk ? v.pch + v.pcl : v.pch + "--") + "h"],
              [t("sp8"), p.sp + "h", v.sp + "h"], [t("acc"), p.a + "h", v.a + "h"], [t("p1"), p.p1 + "h", v.p1 + "h"]];
    },
    flowRam: () => ["0B", "0A", "09", "08", "07", "00"],
    portBox: v => ["P1", v.p1 + "h"]
  };
}

// 8051 ASSEMBLER + EMÜLATÖR (Code Lab)
// =====================================================================
const A51 = (() => {
  const h2 = n => (n & 255).toString(16).toUpperCase().padStart(2, "0");
  const h4 = n => (n & 0xFFFF).toString(16).toUpperCase().padStart(4, "0");
  const T2 = (en, tr) => ({ en, tr });

  // SFR ve bit isimleri
  const SFR = { ACC: 0xE0, B: 0xF0, PSW: 0xD0, SP: 0x81, DPL: 0x82, DPH: 0x83, P0: 0x80, P1: 0x90, P2: 0xA0, P3: 0xB0,
    IE: 0xA8, IP: 0xB8, TMOD: 0x89, TCON: 0x88, TH0: 0x8C, TL0: 0x8A, TH1: 0x8D, TL1: 0x8B, SCON: 0x98, SBUF: 0x99, PCON: 0x87 };
  const SFR_NAME = {}; Object.keys(SFR).forEach(k => SFR_NAME[SFR[k]] = k === "ACC" ? "A" : k);
  const BITS = { CY: 0xD7, AC: 0xD6, F0: 0xD5, RS1: 0xD4, RS0: 0xD3, OV: 0xD2, EA: 0xAF, ES: 0xAC, ET1: 0xAB, EX1: 0xAA, ET0: 0xA9, EX0: 0xA8,
    TF1: 0x8F, TR1: 0x8E, TF0: 0x8D, TR0: 0x8C, IE1: 0x8B, IT1: 0x8A, IE0: 0x89, IT0: 0x88, RI: 0x98, TI: 0x99 };
  const PORTS = { 0x80: "P0", 0x90: "P1", 0xA0: "P2", 0xB0: "P3" };

  // ---------- Komut tablosu: [biçim, opcode, çalıştırma fonksiyonu] ----------
  // Operand rolleri: A AB C DPTR @A+DPTR Rn @Ri #imm #imm16 dir bit rel a11 a16
  const F = [];
  const def = (spec, op, ex) => F.push({ spec, op, ex });

  // Yardımcı işlemler (c = CPU durumu)
  const A = c => c.sfr[0xE0];
  const setA = (c, v) => wr(c, 0xE0, v);
  const bankBase = c => ((c.sfr[0xD0] >> 3) & 3) * 8;
  const rAddr = (c, n) => bankBase(c) + n;
  const rd = (c, a) => { if (a < 0x80) { c.reads.push(a); return c.ram[a]; } return c.sfr[a] ?? 0; };
  const wr = (c, a, v) => { v &= 255; if (a < 0x80) { c.ram[a] = v; c.log.push({ t: "ram", a, v }); } else { c.sfr[a] = v; c.log.push({ t: "sfr", a, v }); if (a === 0x81 && !c.internalSp) c.spBase = v; } };
  const rdInd = (c, i) => { const a = c.ram[rAddr(c, i)]; c.reads.push(a); return c.ram[a]; };
  const wrInd = (c, i, v) => { const a = c.ram[rAddr(c, i)]; c.ram[a] = v & 255; c.log.push({ t: "ram", a, v: v & 255 }); };
  const bitLoc = b => b < 0x80 ? [0x20 + (b >> 3), b & 7] : [b & 0xF8, b & 7];
  const rdBit = (c, b) => { const [a, n] = bitLoc(b); return (rd(c, a) >> n) & 1; };
  const wrBit = (c, b, v) => { const [a, n] = bitLoc(b); const cur = a < 0x80 ? c.ram[a] : (c.sfr[a] ?? 0); wr(c, a, v ? cur | (1 << n) : cur & ~(1 << n)); };
  const CY = c => (c.sfr[0xD0] >> 7) & 1;
  const setPsw = (c, bit, v) => { const p = c.sfr[0xD0]; c.sfr[0xD0] = v ? p | (1 << bit) : p & ~(1 << bit); c.pswChanged = true; };
  const setCY = (c, v) => setPsw(c, 7, v);
  const push = (c, v) => { c.internalSp = true; const s = (c.sfr[0x81] + 1) & 255; wr(c, 0x81, s); c.ram[s] = v & 255; c.log.push({ t: "ram", a: s, v: v & 255 }); c.internalSp = false; };
  const pop = c => { c.internalSp = true; const s = c.sfr[0x81]; c.reads.push(s); const v = c.ram[s]; wr(c, 0x81, (s - 1) & 255); c.internalSp = false; return v; };
  const add = (c, v, cy) => { const a = A(c), r = a + v + cy; setCY(c, r > 255); setPsw(c, 6, ((a & 15) + (v & 15) + cy) > 15); setPsw(c, 2, ((a ^ r) & (v ^ r) & 0x80) !== 0); setA(c, r); };
  const subb = (c, v) => { const a = A(c), cy = CY(c), r = a - v - cy; setCY(c, r < 0); setPsw(c, 6, ((a & 15) - (v & 15) - cy) < 0); setPsw(c, 2, ((a ^ v) & (a ^ r) & 0x80) !== 0); setA(c, r); };
  const jmp = (c, t) => { c.pc = t; };
  const cjne = (c, x, y, t) => { setCY(c, x < y); if (x !== y) jmp(c, t); c.cond = x !== y; };

  // Veri transferi
  def("MOV A,#imm", 0x74, (c, o) => setA(c, o.imm));
  def("MOV A,Rn", 0xE8, (c, o) => setA(c, rd(c, rAddr(c, o.n))));
  def("MOV A,@Ri", 0xE6, (c, o) => setA(c, rdInd(c, o.i)));
  def("MOV A,dir", 0xE5, (c, o) => setA(c, rd(c, o.dir)));
  def("MOV Rn,#imm", 0x78, (c, o) => wr(c, rAddr(c, o.n), o.imm));
  def("MOV Rn,A", 0xF8, (c, o) => wr(c, rAddr(c, o.n), A(c)));
  def("MOV Rn,dir", 0xA8, (c, o) => wr(c, rAddr(c, o.n), rd(c, o.dir)));
  def("MOV dir,A", 0xF5, (c, o) => wr(c, o.dir, A(c)));
  def("MOV dir,#imm", 0x75, (c, o) => wr(c, o.dir, o.imm));
  def("MOV dir,Rn", 0x88, (c, o) => wr(c, o.dir, rd(c, rAddr(c, o.n))));
  def("MOV dir,@Ri", 0x86, (c, o) => wr(c, o.dir, rdInd(c, o.i)));
  def("MOV dir,dir", 0x85, (c, o) => wr(c, o.dir2, rd(c, o.dir)));
  def("MOV @Ri,A", 0xF6, (c, o) => wrInd(c, o.i, A(c)));
  def("MOV @Ri,#imm", 0x76, (c, o) => wrInd(c, o.i, o.imm));
  def("MOV @Ri,dir", 0xA6, (c, o) => wrInd(c, o.i, rd(c, o.dir)));
  def("MOV DPTR,#imm16", 0x90, (c, o) => { wr(c, 0x83, o.imm16 >> 8); wr(c, 0x82, o.imm16); });
  def("MOV C,bit", 0xA2, (c, o) => setCY(c, rdBit(c, o.bit)));
  def("MOV bit,C", 0x92, (c, o) => wrBit(c, o.bit, CY(c)));
  def("MOVC A,@A+DPTR", 0x93, c => setA(c, c.code[(A(c) + (c.sfr[0x83] << 8 | c.sfr[0x82])) & 0xFFFF] || 0));
  def("PUSH dir", 0xC0, (c, o) => push(c, rd(c, o.dir)));
  def("POP dir", 0xD0, (c, o) => wr(c, o.dir, pop(c)));
  def("XCH A,Rn", 0xC8, (c, o) => { const t = rd(c, rAddr(c, o.n)); wr(c, rAddr(c, o.n), A(c)); setA(c, t); });
  def("XCH A,dir", 0xC5, (c, o) => { const t = rd(c, o.dir); wr(c, o.dir, A(c)); setA(c, t); });
  def("XCH A,@Ri", 0xC6, (c, o) => { const t = rdInd(c, o.i); wrInd(c, o.i, A(c)); setA(c, t); });
  // Aritmetik
  [["ADD", 0x24, 0], ["ADDC", 0x34, 1]].forEach(([m, b, k]) => {
    def(m + " A,#imm", b, (c, o) => add(c, o.imm, k ? CY(c) : 0));
    def(m + " A,dir", b + 1, (c, o) => add(c, rd(c, o.dir), k ? CY(c) : 0));
    def(m + " A,@Ri", b + 2, (c, o) => add(c, rdInd(c, o.i), k ? CY(c) : 0));
    def(m + " A,Rn", b + 4, (c, o) => add(c, rd(c, rAddr(c, o.n)), k ? CY(c) : 0));
  });
  def("SUBB A,#imm", 0x94, (c, o) => subb(c, o.imm));
  def("SUBB A,dir", 0x95, (c, o) => subb(c, rd(c, o.dir)));
  def("SUBB A,@Ri", 0x96, (c, o) => subb(c, rdInd(c, o.i)));
  def("SUBB A,Rn", 0x98, (c, o) => subb(c, rd(c, rAddr(c, o.n))));
  def("INC A", 0x04, c => setA(c, A(c) + 1));
  def("INC Rn", 0x08, (c, o) => wr(c, rAddr(c, o.n), rd(c, rAddr(c, o.n)) + 1));
  def("INC dir", 0x05, (c, o) => wr(c, o.dir, rd(c, o.dir) + 1));
  def("INC @Ri", 0x06, (c, o) => wrInd(c, o.i, rdInd(c, o.i) + 1));
  def("INC DPTR", 0xA3, c => { const d = ((c.sfr[0x83] << 8) | c.sfr[0x82]) + 1; wr(c, 0x83, d >> 8); wr(c, 0x82, d); });
  def("DEC A", 0x14, c => setA(c, A(c) - 1));
  def("DEC Rn", 0x18, (c, o) => wr(c, rAddr(c, o.n), rd(c, rAddr(c, o.n)) - 1));
  def("DEC dir", 0x15, (c, o) => wr(c, o.dir, rd(c, o.dir) - 1));
  def("DEC @Ri", 0x16, (c, o) => wrInd(c, o.i, rdInd(c, o.i) - 1));
  def("MUL AB", 0xA4, c => { const r = A(c) * c.sfr[0xF0]; setA(c, r); wr(c, 0xF0, r >> 8); setCY(c, 0); setPsw(c, 2, r > 255); });
  def("DIV AB", 0x84, c => { const b = c.sfr[0xF0]; setCY(c, 0); if (!b) { setPsw(c, 2, 1); return; } const a = A(c); setA(c, Math.floor(a / b)); wr(c, 0xF0, a % b); setPsw(c, 2, 0); });
  // Mantık
  [["ANL", 0x50, (x, y) => x & y], ["ORL", 0x40, (x, y) => x | y], ["XRL", 0x60, (x, y) => x ^ y]].forEach(([m, b, fn]) => {
    def(m + " A,#imm", b + 4, (c, o) => setA(c, fn(A(c), o.imm)));
    def(m + " A,dir", b + 5, (c, o) => setA(c, fn(A(c), rd(c, o.dir))));
    def(m + " A,@Ri", b + 6, (c, o) => setA(c, fn(A(c), rdInd(c, o.i))));
    def(m + " A,Rn", b + 8, (c, o) => setA(c, fn(A(c), rd(c, rAddr(c, o.n)))));
    def(m + " dir,A", b + 2, (c, o) => wr(c, o.dir, fn(rd(c, o.dir), A(c))));
    def(m + " dir,#imm", b + 3, (c, o) => wr(c, o.dir, fn(rd(c, o.dir), o.imm)));
  });
  def("CLR A", 0xE4, c => setA(c, 0));
  def("CPL A", 0xF4, c => setA(c, ~A(c)));
  def("SWAP A", 0xC4, c => setA(c, ((A(c) << 4) | (A(c) >> 4))));
  def("RL A", 0x23, c => setA(c, (A(c) << 1) | (A(c) >> 7)));
  def("RR A", 0x03, c => setA(c, (A(c) >> 1) | (A(c) << 7)));
  def("RLC A", 0x33, c => { const a = A(c), cy = CY(c); setCY(c, a >> 7); setA(c, (a << 1) | cy); });
  def("RRC A", 0x13, c => { const a = A(c), cy = CY(c); setCY(c, a & 1); setA(c, (a >> 1) | (cy << 7)); });
  // Bit işlemleri
  def("CLR C", 0xC3, c => setCY(c, 0));
  def("SETB C", 0xD3, c => setCY(c, 1));
  def("CPL C", 0xB3, c => setCY(c, !CY(c)));
  def("CLR bit", 0xC2, (c, o) => wrBit(c, o.bit, 0));
  def("SETB bit", 0xD2, (c, o) => wrBit(c, o.bit, 1));
  def("CPL bit", 0xB2, (c, o) => wrBit(c, o.bit, !rdBit(c, o.bit)));
  // Dallanma
  def("ACALL a11", 0x11, null);
  def("LCALL a16", 0x12, null);
  def("RET", 0x22, null);
  def("RETI", 0x32, null);
  def("AJMP a11", 0x01, (c, o) => jmp(c, o.addr));
  def("LJMP a16", 0x02, (c, o) => jmp(c, o.addr));
  def("SJMP rel", 0x80, (c, o) => jmp(c, o.rel));
  def("JMP @A+DPTR", 0x73, c => jmp(c, (A(c) + ((c.sfr[0x83] << 8) | c.sfr[0x82])) & 0xFFFF));
  def("JZ rel", 0x60, (c, o) => { c.cond = A(c) === 0; if (c.cond) jmp(c, o.rel); });
  def("JNZ rel", 0x70, (c, o) => { c.cond = A(c) !== 0; if (c.cond) jmp(c, o.rel); });
  def("JC rel", 0x40, (c, o) => { c.cond = !!CY(c); if (c.cond) jmp(c, o.rel); });
  def("JNC rel", 0x50, (c, o) => { c.cond = !CY(c); if (c.cond) jmp(c, o.rel); });
  def("JB bit,rel", 0x20, (c, o) => { c.cond = !!rdBit(c, o.bit); if (c.cond) jmp(c, o.rel); });
  def("JNB bit,rel", 0x30, (c, o) => { c.cond = !rdBit(c, o.bit); if (c.cond) jmp(c, o.rel); });
  def("CJNE A,#imm,rel", 0xB4, (c, o) => cjne(c, A(c), o.imm, o.rel));
  def("CJNE A,dir,rel", 0xB5, (c, o) => cjne(c, A(c), rd(c, o.dir), o.rel));
  def("CJNE Rn,#imm,rel", 0xB8, (c, o) => cjne(c, rd(c, rAddr(c, o.n)), o.imm, o.rel));
  def("CJNE @Ri,#imm,rel", 0xB6, (c, o) => cjne(c, rdInd(c, o.i), o.imm, o.rel));
  def("DJNZ Rn,rel", 0xD8, (c, o) => { const v = (rd(c, rAddr(c, o.n)) - 1) & 255; wr(c, rAddr(c, o.n), v); c.cond = v !== 0; if (c.cond) jmp(c, o.rel); });

  // ---------- İfade değerlendirme ----------
  function parseNum(t) {
    let m;

    if ((m = t.match(/^([0-9][0-9a-f]*)h$/i))) return parseInt(m[1], 16);

    const s = e.replace(/\s+/g, "");
    if (!s) throw T2("Missing value", "Değer eksik");

    let total = 0;
    for (let p of parts) {
      let sign = 1;
      if (p[0] === "+" || p[0] === "-") { if (p[0] === "-") sign = -1; p = p.slice(1); }
      let v = parseNum(p);
      const U = p.toUpperCase();
      if (v === null) {
        if (p === "$") v = ctx.pc;
        else if (U in ctx.sym) v = ctx.sym[U];
        else if (U in SFR) v = SFR[U];

        else if (/^[0-9a-f]+h$/i.test(p)) v = parseInt(p.slice(0, -1), 16);

  // ---------- Operand türü ----------

    if (["A", "AB", "C", "DPTR", "@A+DPTR", "Rn", "@Ri"].includes(role)) return ok.k === role;
    if (role[0] === "#") return ok.k === "#";
    return ok.k === "e";

    for (const ch of s) { if (ch === "'" || ch === '"') q = !q; if (ch === "," && !q) { out.push(cur); cur = ""; } else cur += ch; }
