        c.sfr[0x81] = s2; c.pc = (hi << 8) | lo;
        steps.push({ row: ins.row, t, sub: T2("Micro-step 2/2 · Pop PCL", "Mikro adım 2/2 · PCL stack'ten okunuyor"), fx: [{ k: "fromRam", to: "pc", row: h2(s1), l: "PCL " + h2(lo) + "h" }],
          ops: [T2("PCL ← RAM[" + h2(s1) + "h] = " + h2(lo) + "h", "PCL ← RAM[" + h2(s1) + "h] = " + h2(lo) + "h"), T2("SP ← " + h2(s1) + "h − 1 = " + h2(s2) + "h", "SP ← " + h2(s1) + "h − 1 = " + h2(s2) + "h"), T2("PC = " + h4(c.pc) + "h", "PC = " + h4(c.pc) + "h")],
          n: T2("Return complete. The RAM cells keep their values; only SP moved down.", "Dönüş tamamlandı. RAM hücreleri silinmez, sadece SP aşağı iner."), v: snap() });
        continue;
      }
      // Sıradan komut
      c.log = []; c.reads = []; c.cond = undefined; c.pswChanged = false;
      const pswBefore = c.sfr[0xD0];
      c.pc = next;
      ins.form.ex(c, ins.o);
      markKnown();
      const jumped = c.pc !== next;
      const ops = [T2("PC ← " + h4(pc0) + "h + " + ins.len + " = " + h4(next) + "h", "PC ← " + h4(pc0) + "h + " + ins.len + " = " + h4(next) + "h")];
      const fx = [{ k: "fetch" }, { k: "pcSet", l: jumped ? "PC ← " + h4(c.pc) + "h" : "PC + " + ins.len }];
      const srcA = /,A$|,A,/.test(ins.form.spec) || (mn === "PUSH" && ins.o.dir === 0xE0);
      c.log.forEach(l => {
        if (l.t === "ram") {
          const bank = l.a < 32 && (l.a & 0xF8) === bankBase(c) ? " (R" + (l.a & 7) + ")" : "";
          ops.push(T2("RAM[" + h2(l.a) + "h]" + bank + " ← " + h2(l.v) + "h", "RAM[" + h2(l.a) + "h]" + bank + " ← " + h2(l.v) + "h"));
          if (l.a < 128) fx.push({ k: "toRam", from: srcA ? "a" : "ir", row: h2(l.a), l: h2(l.v) + "h" });
        } else {
          const nm = SFR_NAME[l.a] || h2(l.a) + "h";
          if (l.a === 0xE0) {
            ops.push(T2("A ← " + h2(l.v) + "h", "A ← " + h2(l.v) + "h"));
            const ra = c.reads.find(x => x < 128);
            fx.push(ra !== undefined ? { k: "fromRam", to: "a", row: h2(ra), l: h2(l.v) + "h" } : { k: "bus", from: "ir", to: "a", l: h2(l.v) + "h" });
          } else {
            ops.push(T2(nm + " ← " + h2(l.v) + "h", nm + " ← " + h2(l.v) + "h"));
            if (PORTS[l.a]) { c.port = l.a; fx.push({ k: "bus", from: srcA ? "a" : "ir", to: "p1", l: h2(l.v) + "h" }); }
          }
        }
      });
      if (c.sfr[0xD0] !== pswBefore && (c.sfr[0xD0] & 0xFE) !== (pswBefore & 0xFE)) ops.push(T2("PSW ← " + h2(c.sfr[0xD0]) + "h (CY = " + CY(c) + ")", "PSW ← " + h2(c.sfr[0xD0]) + "h (CY = " + CY(c) + ")"));
      if (c.cond !== undefined) ops.push(c.cond ? T2("Condition true → jump to " + h4(c.pc) + "h", "Koşul doğru → " + h4(c.pc) + "h adresine atla") : T2("Condition false → continue at " + h4(next) + "h", "Koşul yanlış → " + h4(next) + "h ile devam"));
      else if (jumped) ops.push(T2("PC ← " + h4(c.pc) + "h (jump)", "PC ← " + h4(c.pc) + "h (atlama)"));
      const self = jumped && c.pc === pc0 && c.cond === undefined;
      steps.push({ row: ins.row, t, sub: lenTxt, fx, ops,
        n: self ? T2("The instruction jumps to itself, so the program stays here forever (end of program).", "Komut kendisine atlıyor, program burada sonsuza kadar bekler (programın sonu).") : (DESC[mn] || T2("", "")), v: snap() });
      if (self) { halted = true; break; }
    }
    if (!halted) {
      const last = steps[steps.length - 1];
      last.n = T2("Step limit (" + limit + ") reached. The program may be in an endless loop.", "Adım sınırına (" + limit + ") ulaşıldı. Program sonsuz bir döngüde olabilir.");
      last.stop = true;
    }
    return steps;
  }

  // ---------- Opcode açılımı ----------
  const ROLE_MEAN = {
    "#imm": (v) => T2("Immediate data = " + h2(v) + "h", "Anlık veri = " + h2(v) + "h"),
    dir: (v) => T2("Direct address = " + h2(v) + "h" + (SFR_NAME[v] ? " (" + SFR_NAME[v] + ")" : ""), "Doğrudan adres = " + h2(v) + "h" + (SFR_NAME[v] ? " (" + SFR_NAME[v] + ")" : "")),
    bit: (v) => T2("Bit address = " + h2(v) + "h", "Bit adresi = " + h2(v) + "h"),
    rel: (v) => T2("Relative offset = " + h2(v) + "h (" + ((v << 24) >> 24) + ")", "Bağıl ofset = " + h2(v) + "h (" + ((v << 24) >> 24) + ")")
  };
  function opcodeInfo(it) {
    const f = it.form, b = it.bytes, out = [];
    out.push(T2("Opcode: " + f.spec.replace("#imm16", "#data16").replace("#imm", "#data").replace("dir", "direct"), "Opcode: " + f.spec.replace("#imm16", "#data16").replace("#imm", "#data").replace("dir", "direct")));
    let k = 1;
    f.ops.forEach(role => {
      if (role === "#imm") out.push(ROLE_MEAN["#imm"](b[k++]));
      else if (role === "#imm16" || role === "a16") { const w = role === "a16" ? T2("Target address", "Hedef adresin") : T2("16-bit data", "16 bit verinin"); out.push(T2(w.en + " high byte = " + h2(b[k]) + "h", w.tr + " yüksek byte'ı = " + h2(b[k]) + "h")); out.push(T2(w.en + " low byte = " + h2(b[k + 1]) + "h → " + h2(b[k]) + h2(b[k + 1]) + "h", w.tr + " düşük byte'ı = " + h2(b[k + 1]) + "h → " + h2(b[k]) + h2(b[k + 1]) + "h")); k += 2; }
      else if (role === "dir" || role === "bit" || role === "rel") out.push(ROLE_MEAN[role](b[k++]));
      else if (role === "a11") { out[0] = T2("Bits 7–5 = a10 a9 a8 · bits 4–0 = " + f.mn + " opcode", "Bit 7–5 = a10 a9 a8 · bit 4–0 = " + f.mn + " opcode"); out.push(T2("a7…a0 = " + h2(b[k]) + "h → target " + h4(it.o.addr) + "h", "a7…a0 = " + h2(b[k]) + "h → hedef " + h4(it.o.addr) + "h")); k++; }
    });
    if (f.spec === "MOV dir,dir") { out[1] = T2("Source " + out[1].en, "Kaynak · " + out[1].tr); out[2] = T2("Destination " + out[2].en, "Hedef · " + out[2].tr); }
    let formula = T2(it.len + (it.len > 1 ? " bytes" : " byte") + " · " + it.asm, it.len + " byte · " + it.asm);
    if (it.o && it.o.rel !== undefined) formula = T2(formula.en + " · Target = " + h4(it.addr + it.len) + "h + (" + it.o.off + ") = " + h4(it.o.rel) + "h", formula.tr + " · Hedef = " + h4(it.addr + it.len) + "h + (" + it.o.off + ") = " + h4(it.o.rel) + "h");
    if (f.ops.includes("a11")) formula = T2(formula.en + " · Target = upper 5 bits of PC + 11 bits = " + h4(it.o.addr) + "h", formula.tr + " · Hedef = PC'nin üst 5 biti + 11 bit = " + h4(it.o.addr) + "h");
    if (f.ops.includes("a16")) formula = T2(formula.en + " · Target = " + h4(it.o.addr) + "h", formula.tr + " · Hedef = " + h4(it.o.addr) + "h");
    return { bytes: b.map((x, i) => ({ addr: h4(it.addr + i) + "h", hex: h2(x), mean: out[i] || T2("", "") })), formula };
  }

  return { assemble, run, opcodeInfo, MNEMONICS, h2, h4, DESC, SPECS: F.map(f => f.spec) };
})();

const LAB_EXAMPLES = [
  { name: { en: "Subroutine calls (course example)", tr: "Alt program çağrıları (ders örneği)" }, code:
`; Nested subroutine calls with ACALL and LCALL
        ORG   0000h
        LJMP  Main              ; skip the interrupt vector area

        ORG   0030h
Main:   MOV   A,#05h
        ACALL AddSub            ; 2-byte call inside the same 2 KB block
        NOP
        MOV   R0,#10h
        LCALL FarSub            ; 3-byte call, reaches any address
        SJMP  $                 ; end of program

        ORG   0040h
AddSub: ADD   A,#03h
        NOP
        LCALL FarSub            ; nested call
        RET

        ORG   0900h             ; outside the first 2 KB block
FarSub: MOV   P1,A
        NOP
        RET
        END
` },
  { name: { en: "Stack corruption (notebook example)", tr: "Stack bozulması (defterdeki örnek)" }, code:
`; LED routine plus a RAM-clear routine.
; Watch the stack: ClearRam wipes 01h-7Fh, including the return addresses!
        ORG   0000h
        LJMP  Start

        ORG   0030h
Start:  MOV   A,#04h
        ACALL LedOn
        MOV   A,#0FFh
        ACALL LedOn
        SJMP  $

LedOn:  NOP
        MOV   P0,A
        ACALL ClearRam
        NOP
        RET

ClearRam:
        MOV   R0,#7Fh
Clear:  MOV   @R0,#00h
        DJNZ  R0,Clear
        RET                     ; pops 00h:00h -> jumps to 0000h!
        END
` },
  { name: { en: "Loop with DJNZ and port output", tr: "DJNZ döngüsü ve port çıkışı" }, code:
`; Count R7 down from 5 and show it on P1 (LEDs active-low)
        ORG   0000h
        MOV   R7,#05h
Loop:   MOV   A,R7
        CPL   A
        MOV   P1,A
        DJNZ  R7,Loop
        SJMP  $
        END
` },
  { name: { en: "PUSH / POP and a safe stack", tr: "PUSH / POP ve güvenli stack" }, code:
`; Move the stack above the register banks, then swap A and B via the stack
        ORG   0000h
        MOV   SP,#2Fh
        MOV   A,#11h
        MOV   B,#22h
        LCALL SwapAB
        SJMP  $

SwapAB: PUSH  ACC
        PUSH  B
        POP   ACC
        POP   B
        RET
        END
` }
];
const LAB_KEY = "eem305.labCode";
let labModel = null;
const getLabCode = () => ls.get(LAB_KEY, LAB_EXAMPLES[0].code);

// Derlenmiş programdan simülasyon modeli üretir
function buildLabModel(code) {
  const res = A51.assemble(code);
  if (res.errors.length) return null;
  const h4 = A51.h4;
  const FLASH = [], ROW = {};
  let prevEnd = null;
  res.items.forEach(i => {
    if (i.onlyLabel) return;
    if (prevEnd !== null && i.addr > prevEnd) {
      const vec = prevEnd <= 0x0003 && i.addr >= 0x0030;
      FLASH.push({ gap: vec ? { en: h4(prevEnd) + "h–" + h4(i.addr - 1) + "h: interrupt vectors / unused", tr: h4(prevEnd) + "h–" + h4(i.addr - 1) + "h: kesme vektörleri / boş" }
                            : { en: h4(prevEnd) + "h–" + h4(i.addr - 1) + "h: unused", tr: h4(prevEnd) + "h–" + h4(i.addr - 1) + "h: boş" } });
    }
    // Sadece etiket içeren satırların etiketini sonraki komuta taşı
    const lab = res.items.filter(x => x.onlyLabel && x.addr === i.addr).map(x => x.label).concat(i.label ? [i.label] : []).join(" ");
    i.row = FLASH.length;
    ROW[h4(i.addr)] = i.row;
    FLASH.push({ a: h4(i.addr), b: i.bytes.map(A51.h2), lab: lab ? lab + ":" : "", asm: i.asm, item: i });
    prevEnd = i.addr + i.len;
  });
  const STEPS = A51.run(res, 1500);
  return {
    id: "code-lab", title: { en: UI.en.labTitleSim, tr: UI.tr.labTitleSim }, FLASH, ROW, STEPS, ramMode: "grid", scrollFlash: true,
    opcodeInfo: row => A51.opcodeInfo(FLASH[row].item),
    cards: (p, v) => {
      const pk = v.pcl !== "--", po = p.pcl === "--" ? p.pch + "--" : p.pch + p.pcl;
      return [[t("pc16"), po + "h", (pk ? v.pch + v.pcl : v.pch + "--") + "h"], [t("sp8"), p.sp + "h", v.sp + "h"], [t("acc"), p.a + "h", v.a + "h"],
              [t("bReg"), p.b + "h", v.b + "h"], [t("dptr"), p.dptr + "h", v.dptr + "h"], [t("psw"), p.psw + "h·" + p.cy, v.psw + "h·" + v.cy]];
    },
    flowRam: (v, s) => {
      const sp = parseInt(v.sp, 16);
      const top = Math.min(0x7F, Math.max(sp + 2, 4));
      const win = [0, 1, 2, 3, 4].map(i => h2x(top - i));
      const want = (s.fx || []).filter(f => f.row).map(f => f.row).find(r => !win.includes(r));
      return win.concat([want || (win.includes("00") ? h2x(Math.min(0x7F, top + 1)) : "00")]);
    },
    portBox: v => [v.port, v.pv + "h"],
    extra: { label: t("editCode"), onClick: () => location.hash = "#/lab" }
  };
}

// ---------- 8051 assembly dili (CodeMirror sözdizimi renklendirme) ----------
let asm51Lang = null;
function getAsmLanguage() {
  if (asm51Lang) return asm51Lang;
  const MN = new Set(A51.MNEMONICS.concat(["CALL"]));
  const DIR = new Set(["ORG", "EQU", "DB", "END"]);
  const REG = new Set(["A", "B", "C", "AB", "DPTR", "ACC", "PSW", "SP", "DPL", "DPH", "P0", "P1", "P2", "P3", "IE", "IP", "TMOD", "TCON", "TH0", "TL0", "TH1", "TL1", "SCON", "SBUF", "PCON",
    "R0", "R1", "R2", "R3", "R4", "R5", "R6", "R7", "CY", "OV", "AC", "RS0", "RS1", "EA", "TR0", "TR1", "TF0", "TF1"]);
  asm51Lang = CM.StreamLanguage.define({
    name: "asm8051",
    token(stream) {
      if (stream.eatSpace()) return null;
      if (stream.peek() === ";") { stream.skipToEnd(); return "comment"; }
      if (stream.match(/^'[^']*'/) || stream.match(/^"[^"]*"/)) return "string";
      if (stream.match(/^(0x[0-9a-f]+|[0-9][0-9a-f]*h|[01]+b|\d+)\b/i)) return "number";
      if (stream.match(/^[#@$+\-,]/)) return "operator";
      const sol = stream.sol();
      const w = stream.match(/^[A-Za-z_?][\w?]*(\.[0-7])?/);
      if (w) {
        const u = w[0].toUpperCase(), base = u.split(".")[0];
        if (sol && stream.peek() === ":") { stream.next(); return "labelName"; }
        if (MN.has(u)) return "keyword";
        if (DIR.has(u)) return "meta";
        if (REG.has(base)) return "atom";
        return "variableName";
      }
      stream.next();
      return null;
    },
    languageData: { commentTokens: { line: ";" } }
  });
  return asm51Lang;
}
function asmHighlight() {
  const tg = CM.tags;
  return CM.syntaxHighlighting(CM.HighlightStyle.define([
    { tag: tg.keyword, color: "var(--accent)", fontWeight: "600" },
    { tag: tg.meta, color: "#b45309", fontWeight: "600" },
    { tag: tg.atom, color: "var(--ok)" },
    { tag: tg.number, color: "var(--chg)" },
    { tag: tg.string, color: "var(--chg)" },
    { tag: tg.comment, color: "var(--muted)", fontStyle: "italic" },
    { tag: tg.labelName, color: "var(--pc)", fontWeight: "600" },
    { tag: tg.operator, color: "var(--muted)" },
    { tag: tg.variableName, color: "var(--text)" }
  ]));
}
// Otomatik tamamlama: komutlar, direktifler, register'lar ve koddaki etiketler
function asmCompletions(ctx) {
  const w = ctx.matchBefore(/[A-Za-z_?][\w?]*/);
  if (!w || (w.from === w.to && !ctx.explicit)) return null;
  const labels = [...ctx.state.doc.toString().matchAll(/^\s*([A-Za-z_?][\w?]*)\s*:/gm)].map(m => m[1]);
  const opts = A51.MNEMONICS.map(m => ({ label: m, type: "keyword" }))
    .concat(["ORG", "EQU", "DB", "END"].map(d => ({ label: d, type: "constant", detail: "directive" })))
    .concat(["A", "B", "C", "DPTR", "ACC", "PSW", "SP", "P0", "P1", "P2", "P3", "R0", "R1", "R2", "R3", "R4", "R5", "R6", "R7"].map(r => ({ label: r, type: "variable" })))
    .concat([...new Set(labels)].map(l => ({ label: l, type: "function", detail: "label" })));
  return { from: w.from, options: opts, validFor: /^[\w?]*$/ };
}

function renderLab() {
  app.innerHTML =
    '<div class="labPage"><div class="labHead"><h2>' + ic("code-xml") + t("labTitle") + "</h2>" +
      '<button class="btn primary" id="lRun">' + ic("play") + t("labRun") + '</button><button class="btn" id="lOpen">' + ic("folder-open") + t("labOpen") + '</button><button class="btn" id="lSave">' + ic("download") + t("labSave") + "</button>" +
      '<select id="lEx"><option value="">' + t("labExamples") + "</option>" + LAB_EXAMPLES.map((e, i) => '<option value="' + i + '">' + L(e.name) + "</option>").join("") + "</select>" +
      '<span class="hintKey">Ctrl+Enter</span><input type="file" id="lFile" accept=".asm,.a51,.s,.txt" style="display:none"></div>' +
    '<div class="labBody"><div class="editor" id="lEditor"></div>' +
      '<div class="side"><div class="card"><h3>' + ic("cpu") + t("labErrors") + '</h3><div id="lMsg"></div></div>' +
      '<div class="card"><h3>' + ic("info") + t("labRef") + '</h3><div class="ref">' + t("labRefBody") + "</div></div>" +
      '<div class="card"><h3>' + ic("book-open") + t("labSupported") + '</h3><div class="mnList">' + A51.MNEMONICS.map(m => "<span>" + m + "</span>").join("") + "</div></div></div></div></div>";

  const showMsg = res => {
    if (!$("lMsg")) return;
    $("lMsg").innerHTML = res && res.errors.length
      ? res.errors.map(e => '<div class="errItem" data-l="' + e.line + '">' + t("labLine") + " " + e.line + ": " + L(e.msg) + "</div>").join("")
      : '<span class="okMsg">' + t("labOk") + "</span>";
    $("lMsg").querySelectorAll(".errItem").forEach(el => el.onclick = () => goLine(+el.dataset.l));
  };
  // Assembler hatalarını editörde satır işaretleri olarak gösterir
  const asmLinter = CM.linter(view => {
    const res = A51.assemble(view.state.doc.toString());
    showMsg(res);
    return res.errors.map(e => { const ln = view.state.doc.line(Math.min(e.line, view.state.doc.lines)); return { from: ln.from, to: Math.max(ln.from, ln.to), severity: "error", message: L(e.msg) }; });
  }, { delay: 350 });
  const runIt = () => {
    const code = view.state.doc.toString();
    const res = A51.assemble(code);
    showMsg(res);
    if (res.errors.length) { goLine(res.errors[0].line); return true; }
    labModel = buildLabModel(code);
    ls.set("eem305.step.code-lab", 0);
    location.hash = "#/lab/run";
    return true;
  };
  const theme = CM.EditorView.theme({
    "&": { height: "100%", fontSize: "13.5px", backgroundColor: "var(--card)", color: "var(--text)" },
    ".cm-scroller": { fontFamily: "var(--monoFont)", lineHeight: "1.6" },
    ".cm-content": { caretColor: "var(--accent)" },
    ".cm-gutters": { backgroundColor: "var(--soft)", color: "var(--dim)", borderRight: "1px solid var(--border)" },
    ".cm-activeLine": { backgroundColor: "color-mix(in srgb, var(--accent) 7%, transparent)" },
    ".cm-activeLineGutter": { backgroundColor: "color-mix(in srgb, var(--accent) 12%, transparent)", color: "var(--text)" },
    ".cm-selectionBackground, &.cm-focused .cm-selectionBackground, ::selection": { backgroundColor: "color-mix(in srgb, var(--accent) 25%, transparent) !important" },
    "&.cm-focused": { outline: "none" },
    ".cm-tooltip": { backgroundColor: "var(--card)", border: "1px solid var(--border)", borderRadius: "8px", color: "var(--text)" },
    ".cm-tooltip-autocomplete > ul > li[aria-selected]": { backgroundColor: "var(--accent)", color: "var(--onAccent)" },
    ".cm-cursor": { borderLeftColor: "var(--accent)" },
    ".cm-matchingBracket": { backgroundColor: "transparent" }
  }, { dark: effectiveTheme() === "dark" });
  const view = new CM.EditorView({
    parent: $("lEditor"),
    state: CM.EditorState.create({
      doc: getLabCode(),
      extensions: [
        CM.keymap.of([{ key: "Mod-Enter", run: runIt }, CM.indentWithTab]),
        CM.basicSetup, getAsmLanguage(), asmHighlight(), theme,
        CM.lintGutter(), asmLinter,
        CM.autocompletion({ override: [asmCompletions] }),
        CM.EditorState.tabSize.of(8),
        CM.EditorView.updateListener.of(u => { if (u.docChanged) { ls.set(LAB_KEY, u.state.doc.toString()); labModel = null; } })
      ]
    })
  });
  const setCode = code => view.dispatch({ changes: { from: 0, to: view.state.doc.length, insert: code } });
  const goLine = n => { const ln = view.state.doc.line(Math.min(Math.max(1, n), view.state.doc.lines)); view.dispatch({ selection: { anchor: ln.from, head: ln.to }, scrollIntoView: true }); view.focus(); };

  $("lRun").onclick = runIt;
  $("lOpen").onclick = () => $("lFile").click();
  $("lFile").onchange = async () => { const f = $("lFile").files[0]; if (!f) return; setCode(await f.text()); };
  $("lSave").onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([view.state.doc.toString()], { type: "text/plain" })); a.download = "program.asm"; document.body.appendChild(a); a.click(); a.remove(); };
  $("lEx").onchange = () => {
    const i = $("lEx").value; if (i === "") return;
    const cur = view.state.doc.toString();
    if (cur.trim() && cur !== LAB_EXAMPLES[i].code && !confirm(t("discardConfirm"))) { $("lEx").value = ""; return; }
    setCode(LAB_EXAMPLES[i].code); $("lEx").value = "";
  };
  showMsg(null);
  view.focus();
}

// =====================================================================
// KOMUT SETİ SAYFASI — 8051'in 111 komutunun tamamı

    ["SUBB", [["SUBB A,Rn", "98–9F", 1, 1, "CY OV AC", "A ← A − Rn − CY"], ["SUBB A,direct", "95", 2, 1, "CY OV AC", "A ← A − (direct) − CY"], ["SUBB A,@Ri", "96–97", 1, 1, "CY OV AC", "A ← A − ((Ri)) − CY"], ["SUBB A,#data", "94", 2, 1, "CY OV AC", "A ← A − #data − CY"]]],
    ["INC", [["INC A", "04", 1, 1, "", "A ← A + 1"], ["INC Rn", "08–0F", 1, 1, "", "Rn ← Rn + 1"], ["INC direct", "05", 2, 1, "", "(direct) ← (direct) + 1"], ["INC @Ri", "06–07", 1, 1, "", "((Ri)) ← ((Ri)) + 1"], ["INC DPTR", "A3", 1, 2, "", "DPTR ← DPTR + 1"]]],

    ["ANL", [["ANL A,Rn", "58–5F", 1, 1, "", "A ← A ∧ Rn"], ["ANL A,direct", "55", 2, 1, "", "A ← A ∧ (direct)"], ["ANL A,@Ri", "56–57", 1, 1, "", "A ← A ∧ ((Ri))"], ["ANL A,#data", "54", 2, 1, "", "A ← A ∧ #data"], ["ANL direct,A", "52", 2, 1, "", "(direct) ← (direct) ∧ A"], ["ANL direct,#data", "53", 3, 2, "", "(direct) ← (direct) ∧ #data"]]],
    ["ORL", [["ORL A,Rn", "48–4F", 1, 1, "", "A ← A ∨ Rn"], ["ORL A,direct", "45", 2, 1, "", "A ← A ∨ (direct)"], ["ORL A,@Ri", "46–47", 1, 1, "", "A ← A ∨ ((Ri))"], ["ORL A,#data", "44", 2, 1, "", "A ← A ∨ #data"], ["ORL direct,A", "42", 2, 1, "", "(direct) ← (direct) ∨ A"], ["ORL direct,#data", "43", 3, 2, "", "(direct) ← (direct) ∨ #data"]]],
    ["XRL", [["XRL A,Rn", "68–6F", 1, 1, "", "A ← A ⊕ Rn"], ["XRL A,direct", "65", 2, 1, "", "A ← A ⊕ (direct)"], ["XRL A,@Ri", "66–67", 1, 1, "", "A ← A ⊕ ((Ri))"], ["XRL A,#data", "64", 2, 1, "", "A ← A ⊕ #data"], ["XRL direct,A", "62", 2, 1, "", "(direct) ← (direct) ⊕ A"], ["XRL direct,#data", "63", 3, 2, "", "(direct) ← (direct) ⊕ #data"]]],
    ["CLR", [["CLR A", "E4", 1, 1, "", "A ← 0"]]],
    ["CPL", [["CPL A", "F4", 1, 1, "", "A ← ¬A"]]],
    ["RL", [["RL A", "23", 1, 1, "", "A₇₋₁ ← A₆₋₀; A₀ ← A₇"]]],
    ["RLC", [["RLC A", "33", 1, 1, "CY", "A₇₋₁ ← A₆₋₀; A₀ ← CY; CY ← A₇"]]],
    ["RR", [["RR A", "03", 1, 1, "", "A₆₋₀ ← A₇₋₁; A₇ ← A₀"]]],
    ["RRC", [["RRC A", "13", 1, 1, "CY", "A₆₋₀ ← A₇₋₁; A₇ ← CY; CY ← A₀"]]],
    ["SWAP", [["SWAP A", "C4", 1, 1, "", "A₃₋₀ ↔ A₇₋₄"]]]
  ] },
  { g: "bool", title: { en: "Boolean (Bit)", tr: "Boolean (Bit)" }, fam: [
    ["CLR", [["CLR C", "C3", 1, 1, "CY=0", "CY ← 0"], ["CLR bit", "C2", 2, 1, "", "bit ← 0"]]],
    ["SETB", [["SETB C", "D3", 1, 1, "CY=1", "CY ← 1"], ["SETB bit", "D2", 2, 1, "", "bit ← 1"]]],
    ["CPL", [["CPL C", "B3", 1, 1, "CY", "CY ← ¬CY"], ["CPL bit", "B2", 2, 1, "", "bit ← ¬bit"]]],
    ["ANL", [["ANL C,bit", "82", 2, 2, "CY", "CY ← CY ∧ bit"], ["ANL C,/bit", "B0", 2, 2, "CY", "CY ← CY ∧ ¬bit"]]],
    ["ORL", [["ORL C,bit", "72", 2, 2, "CY", "CY ← CY ∨ bit"], ["ORL C,/bit", "A0", 2, 2, "CY", "CY ← CY ∨ ¬bit"]]],
    ["MOV", [["MOV C,bit", "A2", 2, 1, "CY", "CY ← bit"], ["MOV bit,C", "92", 2, 2, "", "bit ← CY"]]],
    ["JC", [["JC rel", "40", 2, 2, "", "if CY = 1: PC ← PC + rel"]]],
    ["JNC", [["JNC rel", "50", 2, 2, "", "if CY = 0: PC ← PC + rel"]]],
    ["JB", [["JB bit,rel", "20", 3, 2, "", "if bit = 1: PC ← PC + rel"]]],
    ["JNB", [["JNB bit,rel", "30", 3, 2, "", "if bit = 0: PC ← PC + rel"]]],
    ["JBC", [["JBC bit,rel", "10", 3, 2, "", "if bit = 1: bit ← 0; PC ← PC + rel"]]]
  ] },
  { g: "branch", title: { en: "Program Branching", tr: "Program Dallanma" }, fam: [
    ["ACALL", [["ACALL addr11", "x1 (11, 31 … F1)", 2, 2, "", "push PC; PC₁₀₋₀ ← addr11"]]],

    ["AJMP", [["AJMP addr11", "x1 (01, 21 … E1)", 2, 2, "", "PC₁₀₋₀ ← addr11"]]],

    ["SJMP", [["SJMP rel", "80", 2, 2, "", "PC ← PC + rel"]]],
    ["JMP", [["JMP @A+DPTR", "73", 1, 2, "", "PC ← A + DPTR"]]],
    ["JZ", [["JZ rel", "60", 2, 2, "", "if A = 0: PC ← PC + rel"]]],

    ["CJNE", [["CJNE A,direct,rel", "B5", 3, 2, "CY", "if A ≠ (direct): jump; CY ← A < (direct)"], ["CJNE A,#data,rel", "B4", 3, 2, "CY", "if A ≠ #data: jump; CY ← A < #data"],
      ["CJNE Rn,#data,rel", "B8–BF", 3, 2, "CY", "if Rn ≠ #data: jump; CY ← Rn < #data"], ["CJNE @Ri,#data,rel", "B6–B7", 3, 2, "CY", "if ((Ri)) ≠ #data: jump; CY ← ((Ri)) < #data"]]],

    ["NOP", [["NOP", "00", 1, 1, "", "—"]]]
  ] }
];
// Emülatörün açıklama sözlüğünde olmayan aileler
const ISA_DESC_EXTRA = {
  MOVX: { en: "Reads or writes external data memory (XRAM) through @Ri or DPTR.", tr: "Harici veri belleğini (XRAM) @Ri ya da DPTR üzerinden okur veya yazar." },
  XCHD: { en: "Exchanges only the low nibble of A with the low nibble of the indirectly addressed RAM byte.", tr: "A'nın alt 4 bitini, dolaylı adreslenen RAM byte'ının alt 4 bitiyle değiştirir." },
  DA: { en: "Decimal-adjusts A after a BCD addition so it holds two valid BCD digits.", tr: "BCD toplamadan sonra A'yı düzeltir; A iki geçerli BCD basamak tutar." },
  JBC: { en: "Jumps if the bit is 1 and clears the bit in the same instruction.", tr: "Bit 1 ise atlar ve aynı komutta biti sıfırlar." },
  ANL_bool: { en: "Logical AND of the carry flag with a bit (or its complement).", tr: "Elde bayrağı (CY) ile bir bitin (ya da tersinin) VE işlemi." },
  ORL_bool: { en: "Logical OR of the carry flag with a bit (or its complement).", tr: "Elde bayrağı (CY) ile bir bitin (ya da tersinin) VEYA işlemi." },
  MOV_bool: { en: "Copies a bit to the carry flag or the carry flag to a bit.", tr: "Bir biti CY'ye ya da CY'yi bir bite kopyalar." }
};
let isaFilter = { q: "", g: "all" };

function renderInstructions() {
  const simSpecs = new Set(A51.SPECS);
  const toSpec = x => x.replace("#data16", "#imm16").replace(/#data/g, "#imm").replace(/direct/g, "dir").replace("addr11", "a11").replace("addr16", "a16");
  const total = ISA.reduce((n, g) => n + g.fam.reduce((m, f) => m + f[1].length, 0), 0);
  app.innerHTML =
    '<div class="wrap isaWrap"><div class="card"><h1>' + ic("book-open") + t("isaTitle") + '</h1><p class="lead">' + t("isaLead").replace("{n}", total) + "</p>" +
    '<div class="isaLegend">' + t("isaLegend") + "</div></div>" +
    '<div class="isaBar"><div class="isaSearch">' + ic("search") + '<input id="isaQ" type="search" placeholder="' + t("isaSearch") + '" value="' + escHtml(isaFilter.q) + '"></div>' +
    '<div class="seg" id="isaG">' + [["all", t("isaAll")]].concat(ISA.map(g => [g.g, L(g.title)])).map(([k, l]) => '<button data-g="' + k + '" class="' + (isaFilter.g === k ? "on" : "") + '">' + l + "</button>").join("") + "</div>" +
    '<span class="isaCount" id="isaCount"></span></div><div id="isaBody"></div></div>';

  const draw = () => {
    const q = isaFilter.q.trim().toUpperCase();
    let shown = 0, html = "";
    ISA.forEach(grp => {
      if (isaFilter.g !== "all" && isaFilter.g !== grp.g) return;
      let rows = "";
      grp.fam.forEach(([mn, list]) => {
        const key = grp.g === "bool" && ["ANL", "ORL", "MOV"].includes(mn) ? mn + "_bool" : mn;
        const desc = ISA_DESC_EXTRA[key] || A51.DESC[mn] || { en: "", tr: "" };
        const hits = list.filter(r => !q || r[0].toUpperCase().includes(q) || r[5].toUpperCase().includes(q) || L(desc).toUpperCase().includes(q) || r[1].includes(q));
        if (!hits.length) return;
        shown += hits.length;
        rows += '<tr class="famRow"><td colspan="7"><span class="famName mono">' + mn + "</span>" + escHtml(L(desc)) + "</td></tr>";
        hits.forEach(r => {
          const sim = simSpecs.has(toSpec(r[0]));
          rows += '<tr><td class="mono isaSyn">' + r[0] + '</td><td class="mono isaOp">' + escHtml(r[5]) + '</td><td class="mono">' + r[1] + '</td><td class="num">' + r[2] + '</td><td class="num">' + r[3] + '</td><td class="mono isaFlags">' + (r[4] || "—") +
            "</td><td>" + (sim ? '<span class="b stack">' + t("isaSim") + "</span>" : '<span class="b stale">' + t("isaRef") + "</span>") + "</td></tr>";
        });
      });
      if (rows) html += '<div class="card isaGroup"><h2>' + L(grp.title) + '</h2><table class="isaTbl"><tr><th>' + t("isaColIns") + "</th><th>" + t("isaColOp") + "</th><th>Opcode</th><th>" + t("bytes") + "</th><th>" + t("isaColCyc") + "</th><th>" + t("isaColFlags") + "</th><th>" + t("isaColSim") + "</th></tr>" + rows + "</table></div>";
    });
    $("isaBody").innerHTML = html || '<div class="card" style="color:var(--muted)">' + t("isaNone") + "</div>";
    $("isaCount").textContent = shown + " / " + total;
  };
  $("isaQ").oninput = e => { isaFilter.q = e.target.value; draw(); };
  $("isaG").querySelectorAll("button").forEach(b => b.onclick = () => { isaFilter.g = b.dataset.g; $("isaG").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); draw(); });
  draw();
  if (window.gsap && settings.animation) gsap.from(".isaGroup", { y: 14, opacity: 0, duration: 0.4, stagger: 0.05, ease: "power2.out", clearProps: "transform,opacity" });
}

route();
</script>
